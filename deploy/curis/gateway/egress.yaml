static_resources:
  listeners:
    - name: openai_https_only
      address:
        socket_address: { address: 0.0.0.0, port_value: 443 }
      listener_filters:
        - name: envoy.filters.listener.tls_inspector
          typed_config:
            "@type": type.googleapis.com/envoy.extensions.filters.listener.tls_inspector.v3.TlsInspector
      filter_chains:
        - filter_chain_match:
            transport_protocol: tls
            server_names: ["api.openai.com"]
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: openai_https
                cluster: openai_api
        - filter_chain_match:
            transport_protocol: tls
            server_names: ["oauth2.googleapis.com"]
          filters:
            - name: envoy.filters.network.tcp_proxy
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.tcp_proxy.v3.TcpProxy
                stat_prefix: google_oauth_https
                cluster: google_oauth
  clusters:
    - name: openai_api
      type: LOGICAL_DNS
      connect_timeout: 5s
      dns_lookup_family: V4_ONLY
      respect_dns_ttl: true
      load_assignment:
        cluster_name: openai_api
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: api.openai.com, port_value: 443 }
    - name: google_oauth
      type: LOGICAL_DNS
      connect_timeout: 5s
      dns_lookup_family: V4_ONLY
      respect_dns_ttl: true
      load_assignment:
        cluster_name: google_oauth
        endpoints:
          - lb_endpoints:
              - endpoint:
                  address:
                    socket_address: { address: oauth2.googleapis.com, port_value: 443 }
