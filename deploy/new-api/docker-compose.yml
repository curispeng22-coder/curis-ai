services:
  new-api:
    image: calciumion/new-api:latest
    container_name: curis-new-api
    restart: unless-stopped
    ports:
      - "${NEW_API_PORT:-3000}:3000"
    environment:
      TZ: "${TZ:-Asia/Shanghai}"
      SESSION_SECRET: "${NEW_API_SESSION_SECRET:?set NEW_API_SESSION_SECRET in .env}"
    volumes:
      - ./data:/data
