name: Linux baseline

on:
  push:
    branches: [t-001-repo-hygiene]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: backend
      CURIS_DB: ${{ runner.temp }}/curis-tests.sqlite
      CURIS_DB_PATH: ${{ runner.temp }}/curis-tests.sqlite
      CURIS_WORKSPACE_DB: ${{ runner.temp }}/curis-tests.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: pip install -r backend/requirements.txt
      # Collection errors remain failures; continue to expose all runnable tests.
      # Existing conftest exclusions are unchanged. Exercise those fixtures below.
      # Existing native/credential/legacy skip gates remain; see T-001 evidence.
      - run: python -m pytest backend/tests --continue-on-collection-errors --basetemp="${{ runner.temp }}/pytest-all" -o cache_dir="${{ runner.temp }}/pytest-cache"
      - if: ${{ !cancelled() }}
        run: python -m pytest backend/tests/test_real_rd_fixture_a.py backend/tests/test_real_rd_fixture_b.py --basetemp="${{ runner.temp }}/pytest-fixtures" -o cache_dir="${{ runner.temp }}/pytest-cache"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.6
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend build
