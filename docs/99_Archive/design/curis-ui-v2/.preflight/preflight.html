<!DOCTYPE html>
<html lang="zh" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Preflight</title>
    <style id="theme-vars">
/* Curis CEO Office — Terra Warm Cream + Forest Green */
/* Brand Prefix: curis */

:root {
  /* ── Brand Primary ── */
  --curis-primary: #4a7c59;
  --curis-primary-dark: #2f523b;
  --curis-primary-light: #e8f0e8;
  --curis-primary-soft: #f0f6f0;

  /* ── Accent (CEO Decision) ── */
  --curis-accent: #705c30;
  --curis-accent-light: #f5efe3;

  /* ── Background ── */
  --curis-bg: #faf6f0;
  --curis-surface: #fffefb;
  --curis-surface-2: #f7f2ea;
  --curis-surface-3: #f0ebe0;

  /* ── Text ── */
  --curis-txt: #1f241c;
  --curis-txt-2: #4a5346;
  --curis-txt-3: #7a8273;

  /* ── Line / Border ── */
  --curis-line: #e8e2d8;
  --curis-line-2: #d9d2c6;

  /* ── State Colors ── */
  --state-success: #15935a;
  --state-success-surface: #e8f5ed;
  --state-info: #3f7d6e;
  --state-warning: #a8742a;
  --state-warning-surface: #f9f0e0;
  --state-error: #b83230;
  --state-error-surface: #fae8e7;

  /* ── Semantic Aliases (for apply-html-head-contract) ── */
  --curis-background: #faf6f0;
  --curis-foreground: #1f241c;
  --curis-card: #fffefb;
  --curis-card-foreground: #1f241c;
  --curis-popover: #fffefb;
  --curis-popover-foreground: #1f241c;
  --curis-primary-foreground: #ffffff;
  --curis-muted: #f0ebe0;
  --curis-muted-foreground: #7a8273;
  --curis-border: #e8e2d8;
  --curis-input: #e8e2d8;
  --curis-ring: #4a7c59;

  /* ── Radius ── */
  --radius-sm: 8px;
  --radius-md: 12px;
  --radius-lg: 16px;
  --radius-full: 9999px;
  --curis-radius-sm: 8px;
  --curis-radius-md: 12px;
  --curis-radius-lg: 16px;
  --curis-radius-small: 8px;
  --curis-radius-medium: 12px;
  --curis-radius-large: 16px;

  /* ── Shadow ── */
  --shadow-sm: 0 1px 2px rgba(74,85,66,.04), 0 4px 12px rgba(74,85,66,.05);
  --shadow-md: 0 2px 4px rgba(74,85,66,.04), 0 4px 12px rgba(74,85,66,.06);
  --shadow-lg: 0 8px 24px rgba(74,85,66,.08);
  --shadow-float: 0 8px 24px rgba(74,85,66,.05);

  /* ── Spacing ── */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-6: 24px;
  --space-8: 32px;
  --space-12: 48px;

  /* ── Typography ── */
  --font-serif: 'Literata', 'Noto Serif SC', 'Songti SC', serif;
  --font-sans: 'Nunito Sans', 'Inter', 'PingFang SC', 'Microsoft YaHei', sans-serif;

  /* Page Title */
  .ph-title {
    font-family: var(--font-serif);
    font-size: 24px;
    line-height: 1.1;
    font-weight: 700;
    color: var(--curis-txt);
  }

  /* Card Title */
  .card-title {
    font-family: var(--font-serif);
    font-size: 15px;
    line-height: 1.3;
    font-weight: 600;
    color: var(--curis-txt);
  }

  /* Module Card Name */
  .module-title {
    font-family: var(--font-serif);
    font-size: 18px;
    line-height: 1.2;
    font-weight: 700;
    color: var(--curis-txt);
  }

  /* Navigation */
  .nav-1 {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.3;
    font-weight: 600;
    color: var(--curis-txt);
  }
  .nav-2 {
    font-family: var(--font-sans);
    font-size: 13px;
    line-height: 1.35;
    font-weight: 500;
    color: var(--curis-txt-2);
  }

  /* Body */
  .body-text {
    font-family: var(--font-sans);
    font-size: 14px;
    line-height: 1.6;
    font-weight: 400;
    color: var(--curis-txt);
  }

  /* Label / Data */
  .label-text {
    font-family: var(--font-sans);
    font-size: 12px;
    line-height: 1.4;
    font-weight: 500;
    color: var(--curis-txt-2);
  }

  /* Helper */
  .helper-text {
    font-family: var(--font-sans);
    font-size: 11px;
    line-height: 1.45;
    font-weight: 400;
    color: var(--curis-txt-3);
  }

  /* Button */
  .btn-text {
    font-family: var(--font-sans);
    font-size: 12px;
    line-height: 1.0;
    font-weight: 700;
  }

  /* ── Component Base Styles ── */
  .card {
    background: var(--curis-surface);
    border: 1px solid var(--curis-line);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-sm);
    overflow: hidden;
  }
  .card-hd {
    padding: var(--space-4);
    border-bottom: 1px solid var(--curis-line);
  }
  .card-bd {
    padding: var(--space-4);
  }
  .card-ft {
    padding: var(--space-3) var(--space-4);
    border-top: 1px solid var(--curis-line);
    background: var(--curis-surface-2);
  }

  .btn-new {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: var(--curis-primary);
    color: var(--curis-primary-foreground);
    border: none;
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-new:hover {
    background: var(--curis-primary-dark);
  }

  .btn-ghost {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 16px;
    background: transparent;
    color: var(--curis-txt-2);
    border: 1px solid var(--curis-line);
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 600;
    cursor: pointer;
    transition: background 0.15s;
  }
  .btn-ghost:hover {
    background: var(--curis-surface-2);
  }

  .tag {
    display: inline-flex;
    align-items: center;
    padding: 3px 10px;
    background: var(--curis-primary-light);
    color: var(--curis-primary-dark);
    border-radius: var(--radius-full);
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 600;
    line-height: 1.3;
  }

  .icon-box {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 40px;
    height: 40px;
    border-radius: var(--radius-md);
    flex-shrink: 0;
  }
  .icon-box.green { background: var(--state-success-surface); }
  .icon-box.cyan { background: #e8f0f0; }
  .icon-box.amber { background: var(--state-warning-surface); }
  .icon-box.red { background: var(--state-error-surface); }
  .icon-box.primary { background: var(--curis-primary-light); }
  .icon-box.surface { background: var(--curis-surface-2); }

  .search-box {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 7px 14px;
    background: var(--curis-surface);
    border: 1px solid var(--curis-line);
    border-radius: var(--radius-sm);
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--curis-txt-3);
  }
  .search-box svg { flex-shrink: 0; }
  .search-box input {
    border: none;
    background: transparent;
    outline: none;
    font-family: var(--font-sans);
    font-size: 13px;
    color: var(--curis-txt);
    width: 100%;
  }

  .empty-box {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: var(--space-8) var(--space-6);
    color: var(--curis-txt-3);
    text-align: center;
  }
  .empty-box svg { opacity: 0.4; margin-bottom: var(--space-3); }
  .empty-box p { font-size: 13px; line-height: 1.5; }

  .boundary {
    padding: var(--space-3) var(--space-4);
    background: var(--curis-surface-2);
    border-radius: var(--radius-md);
    border: 1px dashed var(--curis-line);
  }
  .boundary p {
    font-family: var(--font-sans);
    font-size: 11px;
    line-height: 1.5;
    color: var(--curis-txt-3);
  }

  .back-link {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 500;
    color: var(--curis-txt-3);
    text-decoration: none;
    cursor: pointer;
    transition: color 0.15s;
  }
  .back-link:hover { color: var(--curis-primary); }

  .status-dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .status-dot.green { background: var(--state-success); }
  .status-dot.amber { background: var(--state-warning); }
  .status-dot.red { background: var(--state-error); }

  .cat-bar {
    display: flex;
    align-items: center;
    gap: 6px;
    padding: var(--space-2) 0;
    overflow-x: auto;
  }
  .cat-chip {
    display: inline-flex;
    align-items: center;
    padding: 5px 14px;
    background: var(--curis-surface);
    border: 1px solid var(--curis-line);
    border-radius: var(--radius-full);
    font-family: var(--font-sans);
    font-size: 12px;
    font-weight: 500;
    color: var(--curis-txt-2);
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.15s;
  }
  .cat-chip:hover { background: var(--curis-surface-2); }
  .cat-chip.active {
    background: var(--curis-primary);
    color: var(--curis-primary-foreground);
    border-color: var(--curis-primary);
  }
}

    </style>
