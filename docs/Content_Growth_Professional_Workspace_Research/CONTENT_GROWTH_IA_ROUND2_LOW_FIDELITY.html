<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Content Growth · IA Round 2 · Core Object Structure</title>
<style>
:root{--line:#d8d8d8;--ink:#222;--mut:#666;--bg:#fafafa;--card:#fff;--warn:#fff7d6;--bad:#fdeaea;--ok:#eaf6ec}
*{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}
body{margin:0;background:var(--bg);color:var(--ink);font-size:14px;line-height:1.5}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}
header .muted{font-size:12px}.shell{margin-left:auto;font-size:12px;color:var(--mut)}
.paths,.objects{padding:8px 16px;background:#fff;border-bottom:1px solid var(--line);display:flex;gap:6px;flex-wrap:wrap}
main{max-width:820px;margin:0 auto;padding:16px 16px 80px}.crumb{font-size:12px;color:var(--mut);cursor:pointer;margin-bottom:5px}
button{background:#fff;border:1px solid var(--line);border-radius:5px;padding:6px 10px;cursor:pointer;color:var(--ink);font-size:13px}button:hover{background:#f2f2f2}button.primary{background:#222;color:#fff;border-color:#222}
.card{background:var(--card);border:1px solid var(--line);border-radius:7px;padding:12px;margin:9px 0}.note{background:var(--warn);border:1px solid #eadb98;border-radius:7px;padding:10px;margin:9px 0;font-size:13px}.note.bad{background:var(--bad);border-color:#e5b7b7}.note.ok{background:var(--ok);border-color:#b8d9bd}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:17px;margin:14px 0 7px}h3{font-size:14px;margin:10px 0 5px}.muted{color:var(--mut)}.small{font-size:12px}.row{display:flex;flex-wrap:wrap;gap:7px;align-items:center}.kv{margin:3px 0}.kv b{display:inline-block;color:var(--mut);min-width:92px}.tag{display:inline-block;border:1px solid var(--line);border-radius:4px;padding:1px 6px;font-size:11px;margin:1px}.partial,.conditional{color:#805000;border-color:#a77b2b}.unknown{color:#555;border-color:#777}.unavailable{color:#a22;border-color:#b55}.target{border-style:dashed;color:#805000}.oktag{color:#276d32;border-color:#4f965d}
table{border-collapse:collapse;width:100%;font-size:12px}th,td{border:1px solid var(--line);padding:5px;text-align:left}th{background:#f5f5f5}.flow{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;background:#f4f4f4;border:1px solid var(--line);padding:9px;white-space:pre-wrap;border-radius:5px}.version{border-left:3px solid #bbb;padding-left:9px;margin:7px 0}.version.current{border-color:#222}.drawer{background:#f5f5f5;border:1px dashed #aaa;padding:10px;margin-top:8px}
</style>
</head>
<body>
<header><b>Content Growth</b><span class="muted" id="crumb">· 经营结果</span><span class="shell">Shared Shell：对话 / Employee Current Work（本页仅消费）</span></header>
<div class="paths"><b class="small">核心路径：</b><button onclick="path('A')">A 选题→研究→内容</button><button onclick="path('B')">B 内容→版本→发布</button><button onclick="path('C')">C 对话→Source</button><button onclick="path('E')">E 经营评估</button><button onclick="path('F')">F 问负责员工</button></div>
<div class="objects"><b class="small">结构证明：</b><button onclick="go('topicPool')">Topic Pool</button><button onclick="go('research')">Research / Source</button><button onclick="go('content')">Content / Asset</button><button onclick="go('publishing')">Publishing Target</button><button onclick="go('evaluation')">Evaluation</button><button onclick="go('employee')">Employee Current Work</button></div>
<main id="app"></main>
<script>
var stack=[],view='home',ctx={};
var caps={'XHS 小红书':['PARTIAL','CONDITIONAL','PARTIAL','PARTIAL','PARTIAL','UNAVAILABLE','PARTIAL'],'Douyin 抖音':['PARTIAL','CONDITIONAL','UNKNOWN','UNKNOWN','CONDITIONAL','UNKNOWN','UNKNOWN'],'TikTok':['PARTIAL','CONDITIONAL','UNKNOWN','UNKNOWN','CONDITIONAL','UNKNOWN','UNKNOWN'],'YouTube':['PARTIAL','CONDITIONAL','UNKNOWN','UNKNOWN','CONDITIONAL','UNKNOWN','UNKNOWN'],'Bilibili':['PARTIAL','CONDITIONAL','UNKNOWN','UNKNOWN','CONDITIONAL','UNKNOWN','UNKNOWN']};
function go(v,d){stack.push(view);view=v;if(d)Object.assign(ctx,d);render();scrollTo(0,0)}
function back(){if(stack.length){view=stack.pop();render();scrollTo(0,0)}}
function crumb(){var m={home:'经营结果',topicPool:'Topic Pool / 选题',topic:'Topic / GPT-5.6 办公实测',research:'Research / Evidence',source:'Source Deep View',content:'Content / AI 周报',publishing:'Publishing Target',evaluation:'Evaluation / Feedback',employee:'Employee Current Work',chat:'Universal Conversation'};document.getElementById('crumb').textContent='· '+(m[view]||'对象')}
function render(){crumb();var a=document.getElementById('app');var f={home:home,topicPool:topicPool,topic:topic,research:research,source:source,content:content,publishing:publishing,evaluation:evaluation,employee:employee,chat:chat};a.innerHTML=(f[view]||home)()}
function badge(s){var c={PARTIAL:'partial',CONDITIONAL:'conditional',UNKNOWN:'unknown',UNAVAILABLE:'unavailable'}[s]||'target';return '<span class="tag '+c+'">'+s+'</span>'}
function backLink(){return '<div class="crumb" onclick="back()">← 返回上一层（保留 Context）</div>'}
function home(){return `
<h1>经营结果 → 核心对象结构</h1>
<div class="note">本稿是 IA Round 2 低保真结构证明。默认 CEO 先看结果；专业对象按需下钻。下方 6 个结构证明不是 6 个一级导航。</div>
<div class="card"><h2>推荐选题</h2><div class="kv"><b>GPT-5.6 办公实测</b> 与“涨粉→接广告”目标相关；时效高；准确性存在 UNKNOWN。</div><div class="kv"><b>建议</b>先调研，再决定是否生产。</div><div class="row"><button class="primary" onclick="go('topic',{id:'t1'})">查看为什么</button><button onclick="go('chat',{employee:'王颖',object:'Topic t1'})">问负责员工</button><button onclick="go('topicPool')">进入完整选题池</button></div></div>
<div class="card"><h2>推荐成品</h2><div class="kv"><b>AI 周报</b> 推荐版本 v2；当前是草案；素材可复用。</div><div class="row"><button class="primary" onclick="go('content')">查看 / 修改</button><button onclick="go('publishing')">准备发布（目标结构）</button></div></div>
<div class="card"><h2>最近做得怎么样？</h2><div class="kv"><b>默认先看</b>经营结论、Goal 关系、什么有效、什么没证明、下一步。</div><button onclick="go('evaluation')">查看 Evaluation</button></div>
<div class="note bad">能力诚实边界：五个平台没有任何 audited VERIFIED capability。Publish=CONDITIONAL；Multi-account=UNAVAILABLE；不可显示已连接、真实发布、真实 URL、实时 Analytics 或实时 Comments。</div>`}
function topicPool(){return `${backLink()}<h2>Topic Pool <span class="tag target">ON-DEMAND DEEP VIEW</span></h2><div class="note">CEO 默认不维护完整池。AI Employee 负责日常发现、去重与状态维护；CEO 进入这里主要为了查看、干预、指定、找历史。</div><div class="row"><input placeholder="搜索选题" style="padding:6px;border:1px solid var(--line);border-radius:5px"><button>筛选</button><button>历史 / 重复</button><button onclick="note('批量操作仅在明确减少重复劳动时开放')">批量操作（仅必要时）</button></div><table><tr><th>选题</th><th>状态语义</th><th>推荐动作</th></tr><tr><td>GPT-5.6 办公实测</td><td>推荐 / 候选</td><td><button onclick="go('topic',{id:'t1'})">查看</button></td></tr><tr><td>AI 周报</td><td>已采用</td><td><button onclick="go('content')">查看内容</button></td></tr><tr><td>旧模型对比</td><td>暂缓 / 历史</td><td><button onclick="note('可恢复；不从历史删除')">恢复</button></td></tr></table><div class="kv muted small">推荐、候选、调研中、暂缓、已采用、已放弃、历史/重复是状态或筛选语义，不是固定六个 Tab。</div>`}
function topic(){return `${backLink()}<h2>Topic：GPT-5.6 办公实测</h2><div class="card"><div class="kv"><b>为什么值得做</b>与涨粉→接广告目标相关；同类实测有潜在收藏价值。</div><div class="kv"><b>时效 / 价值</b>时效高；价值是影响力资产，不把平台指标直接当 Business Value。</div><div class="kv"><b>风险 / Unknown</b>准确性与社区争议待验证；归因未知。</div><div class="kv"><b>责任 / 员工</b>选题判断 / 王颖（示例承担人，不冻结 Headcount）。</div><div class="kv"><b>当前状态</b>推荐；尚未批准进入 Content。</div></div><div class="row"><button class="primary" onclick="go('research',{mode:'continue'})">先调研</button><button onclick="go('content',{from:'topic'})">直接生成</button><button onclick="go('chat',{employee:'王颖',object:'Topic t1'})">问王颖</button><button onclick="note('已记录调整意见，Topic 保留在同一模型')">调整</button><button onclick="note('已暂缓；AI Employee 仍保留历史')">暂缓</button><button onclick="note('已放弃；可从历史恢复')">放弃</button></div><div class="card"><h3>同一 Topic 模型的三种进入</h3><div class="kv">AI 推荐：Signal / Opportunity 评估后进入 Topic candidate。</div><div class="kv">用户直接说：Conversation 解析为 Topic candidate，缺少必要决策才追问。</div><div class="kv">Opportunity 转 Topic：保留 Opportunity provenance，不复制另一对象。</div></div>`}
function research(){var newR=ctx.mode==='new';return `${backLink()}<h2>Research Result / Evidence</h2><div class="card"><div class="kv"><b>结论</b>${newR?'官方来源复查仍不足以证明全部结论。':'建议先验证 GPT-5.6 办公场景，再决定是否生产。'}</div><div class="kv"><b>为什么</b>官方文档支持能力描述；社区实测为单源；对标表现待验证。</div><div class="kv"><b>意味着什么</b>可形成一个有证据边界的实测内容方向。</div><div class="kv"><b>风险 / Unknown</b>平台外部数据与商业归因尚未证明。</div><div class="kv"><b>建议</b>补查独立来源，或限定只使用官方来源。</div></div><div class="card"><h3>按需展开 Evidence</h3><div class="kv">Source A：官方文档 <span class="tag oktag">可定位</span></div><div class="kv">Source B：社区讨论 <span class="tag unknown">UNKNOWN / 单源</span></div><div class="kv">Contradiction：社区实测与官方描述需要核对</div><div class="row"><button onclick="go('source')">查看 Source Deep View</button><button onclick="note('Research History：保留上一结论与本次补查差异')">查看 History</button></div></div><div class="row"><button class="primary" onclick="note('已继续同一 Research Work；结果回到 Topic')">继续原 Research</button><button onclick="go('research',{mode:'new'})">创建新 Research</button><button onclick="note('已记录不同意，进入原 Research 反驳/补查分支')">我不同意，补查</button><button onclick="note('已创建 Source Constraint：只用官方来源')">只用官方来源重查</button><button onclick="go('content',{from:'research'})">批准并进入 Content</button></div><div class="note">同一 Topic / 同一问题 / 同一 Scope = 继续原 Research；改变问题、Scope、目标或 Source Authority = 创建新 Research 并链接旧结论。</div>`}
function source(){return `${backLink()}<h2>Source Deep View <span class="tag target">ON-DEMAND · Employee tool</span></h2><div class="note">CEO 通常说“以后重点看这个网站”，由 Employee 完成配置；本视图只为主动管理时提供专业能力，不是默认后台。</div><div class="row"><button class="primary" onclick="note('已加入待确认 Source；由王颖完成采集与失效处理')">添加来源</button><button onclick="note('批量添加仅在明确减少重复劳动时开放')">批量添加</button><button onclick="note('已暂停；不删除历史 Evidence')">暂停</button><button onclick="note('已归档；历史 Research 仍可追溯')">归档</button></div><table><tr><th>Source</th><th>类型 / 可信度</th><th>最近采集</th><th>使用中的 Research</th><th>状态</th></tr><tr><td>openai.com</td><td>官方 / 高</td><td>待采集</td><td>GPT-5.6 实测</td><td>可用待验证</td></tr><tr><td>社区账号</td><td>社区 / 待核</td><td>未知</td><td>GPT-5.6 实测</td><td>${badge('UNKNOWN')}</td></tr></table><div class="kv muted small">授权、失效、采集失败等异常回到 Employee Current Work 与原 Research Context。</div>`}
function content(){return `${backLink()}<h2>Content：AI 周报 <span class="tag target">推荐成品 / 草案</span></h2><div class="card"><div class="kv"><b>来源</b>Topic：GPT-5.6 办公实测；Research conclusion + Evidence refs 已携带。</div><div class="kv"><b>推荐版本</b>v2；为什么这样做：先讲三个可复现办公场景。</div><div class="kv"><b>当前素材</b>封面图、实测截图、官方引用；可替换、生成、上传或选择历史素材。</div><div class="kv"><b>必要风险</b>事实审核、AI 标识、平台规则；平台发布能力当前未验证。</div></div><div class="card"><h3>Draft / Version</h3><div class="version current"><b>v2 · 推荐版本</b> 当前草案 · 一句话修改会生成新 Version <button onclick="note('已生成 v3；v2 仍可恢复')">说一句修改</button></div><div class="version"><b>v1</b> 初版草案 <button onclick="note('已恢复 v1 为 Recommended Version；v2 未删除')">恢复上一版</button></div><div class="row"><button onclick="note('已生成另一版；不会覆盖历史版本')">再来一版</button><button onclick="note('进入直接编辑 Deep View')">直接编辑</button><button onclick="note('审核问题：事实与渠道规则待确认')">查看审核问题</button></div></div><div class="drawer"><b>Asset Drawer · 同一 Content Surface</b><div class="kv">封面图（历史可复用） · 实测截图 · 官方引用</div><div class="row"><button onclick="note('已替换推荐素材')">替换素材</button><button onclick="note('已生成候选素材，等待选择')">生成素材</button><button onclick="note('已上传素材，挂到当前 Content')">上传素材</button><button onclick="note('已选择历史素材，不创建第二个 Library')">选择历史素材</button></div></div><div class="row"><button class="primary" onclick="go('publishing')">准备发布</button><button onclick="go('chat',{employee:'李想',object:'Content AI 周报 v2'})">问李想</button></div>`}
function publishing(){var rows=Object.keys(caps).map(function(k){return '<tr><td>'+k+'</td>'+caps[k].map(function(s){return '<td>'+badge(s)+'</td>'}).join('')+'</tr>'}).join('');return `${backLink()}<h2>Publishing Target Structure</h2><div class="flow">Content → Channel → Account → Variant → Publication → Receipt</div><div class="note bad"><b>Current Capability Truth：</b>五个平台没有任何 audited VERIFIED capability。下表只是 Audit 状态；不表示已连接、可真实发布或已有账号。</div><table><tr><th>Channel</th><th>Auth</th><th>Publish</th><th>Schedule</th><th>Pub Status</th><th>Receipt/URL</th><th>Analytics</th><th>Comments</th></tr>${rows}</table><div class="card"><h3>Target Product Structure <span class="tag target">TARGET SCENARIO / NOT CURRENT CAPABILITY</span></h3><div class="kv"><b>Employee 推荐</b>发哪里、哪个 Account、何时、为什么。</div><div class="kv"><b>CEO 动作</b>确认、调整、讨论；不管理发布矩阵。</div><div class="kv"><b>当前结果</b>等待能力 / 未授权 / UNKNOWN / 人工未验证回执 / 失败 / 部分能力存在。</div><div class="row"><button onclick="note('当前 Publish=CONDITIONAL，发布动作不可用')">确认发布（目标演示）</button><button onclick="go('employee',{employee:'陈帆',object:'Publishing Target'})">问渠道员工</button></div></div>`}
function evaluation(){return `${backLink()}<h2>Evaluation / Feedback</h2><div class="card"><div class="kv"><b>结果是什么</b>当前内容带来一些平台反馈，但商业归因尚未证明。</div><div class="kv"><b>为什么</b>可见反馈来自有限来源，时间窗口与样本不足。</div><div class="kv"><b>与 Goal 关系</b>可能支持涨粉方向；“以后接广告”的 Business Value 仍为 UNKNOWN。</div><div class="kv"><b>什么有效</b>实测场景更容易形成内容反馈。</div><div class="kv"><b>什么没证明</b>浏览、点赞、粉丝 ≠ 商业价值；Attribution not proven。</div><div class="kv"><b>下一步</b>继续一个可复现 Topic，或补充 Evidence。</div></div><div class="card"><h3>Deep View：Feedback → Evidence</h3><div class="kv">Content：AI 周报 · Topic：GPT-5.6 实测 · Channel：未知/未连接</div><div class="kv">Metric：部分手工记录 · Feedback：Employee 归一 · Freshness：需确认</div><div class="kv">Evidence provenance：保留 source / freshness / unknown；不先画 Dashboard。</div></div><div class="row"><button class="primary" onclick="go('topic',{id:'t1'})">按建议进入下一 Topic</button><button onclick="go('employee',{employee:'周明',object:'Evaluation'})">问评估员工</button></div>`}
function employee(){var e=ctx.employee||'王颖',o=ctx.object||'Topic t1';return `${backLink()}<h2>Employee Current Work <span class="tag target">Shared Shell Pattern</span></h2><div class="note">当前员工视图不是任务列表；它显示责任、关联对象、Result、Evidence、下一步、等待与 Handoff。Domain 只提供对象 Context。</div><div class="card"><div class="kv"><b>员工</b>${e}（示例承担人；不冻结 Headcount）</div><div class="kv"><b>Responsibility</b>负责对应领域工作；责任不等于员工身份。</div><div class="kv"><b>当前在做</b>围绕 ${o} 继续研究 / 生产 / 评估。</div><div class="kv"><b>已有 Result</b>结论、Evidence refs、Unknown 与建议已回写原对象。</div><div class="kv"><b>下一步 / 等待</b>等待必要能力或 CEO 判断时显式标记；完成后 Handoff 回原对象。</div><div class="row"><button class="primary" onclick="go('chat',{employee:e,object:o})">直接对话（自动带 Context）</button><button onclick="note('打开当前 Work 的对象上下文')">当前工作</button><button onclick="note('打开员工资料；不离开 Shared Shell')">员工资料</button></div></div><div class="card"><h3>Domain Context</h3><div class="kv">Workspace：Content Growth · Responsibility：当前责任 · Object：${o}</div><div class="row"><button onclick="go('topic',{id:'t1'})">返回 Topic</button><button onclick="go('research')">查看 Research</button><button onclick="go('content')">查看 Content</button></div></div>`}
function chat(){return `${backLink()}<h2>Universal Conversation <span class="tag target">Shared Shell</span></h2><div class="note">对象已自动带入：${ctx.object||'当前经营结果'}；负责员工：${ctx.employee||'团队'}。用户无需重新解释背景。</div><div class="card"><div>用户：${ctx.employee?'继续处理这个对象，并告诉我下一步。':'以后重点看这个网站（openai.com）。'}</div><div class="kv"><b>Employee</b>收到，已在当前 Responsibility 下继续；结果会回到原对象与经营结果。</div><div class="row"><button onclick="go('source')">查看 Source 处理结果</button><button onclick="go('research')">继续原 Research</button><button onclick="go('content')">回到 Content</button></div></div>`}
function note(t){var a=document.getElementById('app');a.insertAdjacentHTML('afterbegin','<div class="note ok">'+t+'</div>');scrollTo(0,0)}
function path(p){var m={A:'topic',B:'content',C:'chat',E:'evaluation',F:'employee'};go(m[p]||'home')}
render();
</script>
</body>
</html>
