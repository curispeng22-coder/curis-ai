ay:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day{min-height:94px;border:1px solid var(--line);border-radius:8px;padding:8px;color:var(--t3)}.day.active{border-color:var(--a);background:var(--s)}.day b{color:var(--text)}.day span{display:block;margin-top:8px;color:#dcefe3;font-size:11px}.automation{border-top:1px solid var(--line)}.auto{display:grid;grid-template-columns:100px minmax(0,1fr) auto;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.meeting{max-width:880px;margin:auto}.meeting-top{padding-bottom:12px;border-bottom:1px solid var(--line)}.meeting-top p{margin:4px 0}.decision{padding:12px 0;border-top:1px solid #765522;border-bottom:1px solid #765522}.dialog-back{position:fixed;inset:0;z-index:20;display:grid;place-items:center;background:#0009;padding:24px}.dialog{width:min(860px,100%);max-height:calc(100vh - 48px);overflow:auto;border:1px solid var(--line);border-radius:12px;background:var(--s);padding:22px}.dialog h2{font-size:22px}.menu{position:fixed;z-index:30;left:12px;bottom:62px;width:260px;border:1px solid var(--line);border-radius:9px;background:var(--s);box-shadow:0 12px 32px #0008;padding:5px}.menu button{display:flex;width:100%;min-height:35px;padding:0 8px;border-radius:6px}.menu button:hover{background:var(--s2);color:var(--text)}.overlay{position:fixed;right:16px;bottom:16px;z-index:15;width:370px;border:1px solid var(--line);border-radius:10px;background:var(--s);box-shadow:0 12px 32px #0008;padding:14px}.toast{position:fixed;right:18px;bottom:18px;z-index:40;border:1px solid #397052;border-radius:8px;background:#273c31;color:#dcefe3;padding:10px 12px}.settings{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:calc(100vh - 108px);border:1px solid var(--line);border-radius:10px;overflow:hidden}.setting-nav{padding:12px;border-right:1px solid var(--line);background:var(--s)}.setting-nav button{display:block;width:100%;min-height:34px;border:0;border-radius:6px;background:transparent;color: </style></head><body><div id="app"></div><script>
const S={area:'home',work:null,tab:'overview',station:'codex',pane:null,context:true,dialog:null,meeting:'list',decision:false,studio:false,studioStep:'overview',account:false,assistant:false,notice:false,settings:false,settingsTab:'general',toast:'',messages:{codex:[],copy:[],meeting:[]}};
const esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const btn=(t,a,d='',c='ghost')=>`<button class="${c}" data-a="${a}" ${d}>${t}</button>`;const ava=x=>`<span class="ava">${x}</span>`;const head=(t,d)=>`<div class="eyebrow">Curis · ${t}<span class="snapshot">REVIEW REQUIRED · 示例快照 · 非真实运行</span></div><div class="header"><div><h1>${t}</h1><p>${d}</p></div></div>`;
function nav(){const ns=[['home','⌂','首页 / CEO 工作台'],['business','▦','业务空间'],['org','⌘','组织中心'],['market','◉','人才市场'],['library','▤','资料库'],['meetings','○','会议']];return `<aside class="nav"><div class="brand"><span class="logo">C</span><span>Curis</span></div>${ns.map(x=>`<button class="${S.area===x[0]&&!S.work?'active':''}" data-a="area" data-v="${x[0]}"><span>${x[1]}</span><span>${x[2]}</span></button>`).join('')}<div class="recent"><label>最近工作</label><button data-a="work" data-v="dev">◈ <span>Curis 产品研发</span></button><button data-a="work" data-v="xhs">◈ <span>小红书运营</span></button><button data-a="work" data-v="video">◈ <span>短视频运营</span></button></div><div class="bottom"><button data-a="account">${ava('齐')}<span>齐活林 · CEO</span></button></div></aside>`}
function context(){if(!(S.work==='dev'||S.area==='library'||S.settings)||!S.context)return '';let title='资料库',groups=[['浏览',['最近资料','本地资料','外部资料库','公司产生']],['文件夹',['产品 / UI 设计','用户研究','会议与决定']]];if(S.work==='dev'){title='产品研发';groups=[['Thread',['Shell 交互重构','市场招募路径','会议对话模型']],['项目',['Curis UI Blueprint','Prototype','Review']],['历史',['等待 Review','最近变更']]]}if(S.settings){title='设置';groups=[['设置',['通用','外观','公司资料']],['AI 与能力',['模型','连接器','数据与资料']]]}return `<aside class="context"><div class="ctx-head">${title}${btn('×','context')}</div><div class="ctx-search">⌕ 搜索${S.work==='dev'?' Thread 与文件':'资料'}</div>${groups.map(g=>`<div class="ctx-group"><small>${g[0]}</small>${g[1].map((i,n)=>`<button class="ctx-item ${n===0?'active':''}" data-a="toast" data-msg="示例：已选择 ${i}">${i}</button>`).join('')}</div>`).join('')}</aside>`}
function topbar(){let cr=S.work?({dev:'业务空间 / 软件研发 / Curis 产品研发',xhs:'业务空间 / 内容增长 / 小红书运营',video:'业务空间 / 内容增长 / 短视频运营'}[S.work]):S.settings?'设置':({home:'首页 / CEO 工作台',business:'业务空间',org:'组织中心',market:'人才市场',library:'资料库',meetings:'会议'}[S.area]);return `<header class="top"><span class="crumb">${cr}</span><span class="grow"></span>${btn('⌕ 搜索 Curis','toast','data-msg="示例：全局搜索会保留当前工作现场。"','search')}${btn('待处理 · 4','notice')}${btn('✦ CEO Assistant','assistant')}</header>`}
function home(){return head('首页 / CEO 工作台','先看今天最需要 CEO 继续的事，然后直接回到来源工作。')+`<section class="brief"><div><small class="muted">CEO Assistant · 今日简报</small><h2>确认产品方向会议里的访谈范围。</h2><p>研发团队已完成 Workspace 交互建议；决定后会把任务交回开发工程师的当前 Session。</p>${btn('进入产品方向会议','meeting','', 'primary')}</div><div>${[['正在推进','3'],['等待你决定','1'],['需补能力','1']].map(x=>`<div class="stat"><span>${x[0]}</span><b>${x[1]}</b></div>`).join('')}</div></section><h2 style="margin:26px 0 8px">继续工作</h2><div class="line-list">${row('产品研发办公室','开发工程师正在适配 Shell','dev','刚刚')}${row('小红书运营','明天 09:00 的图文待审核','xhs','今天')}${row('产品方向会议','3 位员工已给出建议，等待 CEO','meeting','15:00','warn')}</div>`}
function row(t,d,a,m='',c=''){return `<button class="row" data-a="${a==='dev'||a==='xhs'||a==='video'?'work':a}" data-v="${a==='dev'||a==='xhs'||a==='video'?a:''}">${`<span class="dot ${c}"></span><span><b>${t}</b><p>${d}</p></span><span class="muted">${m} →</span>`}</button>`}
function business(){return head('业务空间','公司正在经营的业务，以及每项业务正在工作的专业办公室。')+`<div class="line-list">${row('完善 Curis','软件研发 · 产品研发办公室 · 当前：Shell 交互重构','dev','进入办公室')}${row('小红书','内容增长 · 小红书运营 · 当前：下周内容角度','xhs','进入办公室','warn')}${row('短视频','内容增长 · 短视频运营 · 当前：第一支视频脚本','video','进入办公室')}</div><h2 style="margin:28px 0 8px">最近结果</h2><div class="line-list">${row('UI 空间原语审阅','资料库与研发 Workspace 需要真实上下文栏','toast','产品研发')}${row('发布数据','外部平台尚未连接，真实阅读与互动未记录','toast','小红书')}</div>`}
function org(){let body=S.tab==='structure'?`<div class="org"><button class="node" data-a="station" data-v="lin"><b>齐活林 · CEO</b><p>公司方向与最终决定</p></button><div class="org-row"><button class="node" data-a="station" data-v="lin"><b>Lin · 产品研究</b><p>软件研发 · 产品方向</p></button><button class="node" data-a="station" data-v="zhou"><b>周知 · 研发</b><p>产品研发办公室</p></button><button class="node" data-a="station" data-v="wei"><b>魏然 · 内容增长</b><p>小红书与短视频</p></button></div></div>`:`<div class="network"><section><h2>产品研发</h2><p>Lin 提供访谈资料；周知负责研发；开发工程师等待 CEO 决定。</p><span class="pill ok">正在协作</span></section><section><h2>小红书运营</h2><p>魏然负责；Lin 参与受众验证；文案员工等待审核。</p><span class="pill wait">待审核</span></section><section><h2>短视频运营</h2><p>魏然跨业务负责；视频制作与数据分析在当前视频协作。</p><span class="pill">工作中</span></section></div>`;return head('组织中心','组织结构回答谁属于哪里；协作关系回答谁正在和谁一起做什么。')+tabs([['structure','组织结构'],['collaboration','协作关系']],S.tab)+body}
function market(){return head('人才市场','发现专家、Skill、Connector；招募后才成为 Company Employee。')+tabs([['experts','专家'],['skills','技能'],['connectors','连接器']],S.tab)+`<div class="market">${[['产品研究专家','用户研究、资料归纳与方向判断','周'],['研发负责人','技术方案、Review 与交付把关','顾'],['内容编辑','图文选题、写作与审核','苏'],['短视频策划','脚本、素材与发布节奏','林']].map(x=>`<button data-a="expert"><b>${x[2]}　${x[0]}</b><p>${x[1]}</p><span class="pill ok">可招募</span></button>`).join('')}</div>`}
function library(){return `<article class="library">${head('资料库','资料在主区阅读；目录用于持续浏览；属性只在需要时出现。')}<p class="muted">产品 / UI 设计 / Workspace 空间原语</p><h1>Curis Workspace 的 UI 契约</h1><p>员工 Workstation 位于主工作区。项目、Thread、文件和资料目录可以进入上下文栏；当前对象的来源、权限、引用与使用关系按需进入 Flexible Utility Pane。</p><p class="quote">“需要时出现，不需要时不存在”适用于上下文栏与 Utility Pane。</p>${btn('查看来源与引用','pane','data-v="source"')}</article>`}
function tabs(xs,active){return `<div class="tabs">${xs.map(x=>`<button class="tab ${x[0]===active?'active':''}" data-a="tab" data-v="${x[0]}">${x[1]}</button>`).join('')}</div>`}
const stations={pm:['产品经理','ChatGPT','已完成 · 已交接','用户访谈范围'],architect:['架构师','Claude','已完成 · 等待确认','Adapter 边界'],codex:['开发工程师','Codex','工作中 · Shell 适配','当前提交与测试'],qa:['QA','GPT','等待 · 开发完成','回归测试'],copy:['文案','GPT','待审核 · 图文草稿','明天 09:00 发布'],research:['研究','Claude','工作中 · 热点分析','选题池'],video:['视频制作','Codex','工作中 · 第一支视频','字幕与封面']};
function stationCard(id){let x=stations[id];return `<button class="station ${S.station===id?'active':''}" data-a="station" data-v="${id}">${ava(id==='codex'?'C':id==='qa'?'Q':id==='copy'?'文':'研')}<b>${x[0]} · ${x[1]}</b><small>${x[3]}</small><em>${x[2]}</em></button>`}
function session(id){let x=stations[id]||stations.codex,arr=[['系统',`${x[0]} 已恢复当前 Session。自动进展与 CEO 介入共用这条上下文。`],['员工',id==='codex'?'我正在将 Shell 的现有逻辑收束到 Adapter 边界，当前 Test 仍保持。':'我已整理当前工作与下一步。']].concat(S.messages[id]||[]);return `<section class="session"><div class="session-title">${ava(x[0].slice(0,1))}<div><b>${x[0]} · ${x[1]}</b><p>${x[2]} · 当前：${x[3]}</p></div><span class="grow"></span>${btn('↗','focus')}${btn('□','maximize')}</div><div class="messages">${arr.map((m,i)=>`<div class="msg ${m[0]==='CEO'?'me':''}">${ava(m[0]==='CEO'?'齐':m[0].slice(0,1))}<div class="bubble"><b>${m[0]}</b><p>${m[1]}</p>${id==='codex'&&i===1?`<div class="tags"><span class="tag">当前产出</span><button class="tag" data-a="pane" data-v="diff">Diff</button><button class="tag" data-a="pane" data-v="html">HTML</button><button class="tag" data-a="pane" data-v="test">Test</button></div>`:id==='copy'&&i===1?`<div class="tags"><span class="tag">当前图文</span><button class="tag" data-a="pane" data-v="publish">发布预览</button></div>`:''}</div></div>`).join('')}</div><div class="composer"><button class="icon" data-a="toast" data-msg="可引用资料、@员工或附加当前对象。">＋</button><textarea id="composer" placeholder="继续指导 ${x[0]} 的当前工作…"></textarea><button class="send" data-a="send" data-v="${id}">↑</button></div></section>`}
function pane(){if(!S.pane)return '';let body={diff:'<pre>+ adapter = createAdapter(session)\n+ await adapter.continue({ scope: "shell" })\n- runWorkflow(nodeGraph)</pre>',html:'<pre>&lt;main class="curis-workspace"&gt;\n  &lt;section data-station="codex"&gt;…&lt;/section&gt;\n&lt;/main&gt;</pre>',test:'<pre>Shell layout             PASS\nContext sidebar collapse PASS\nEmployee session resume  PASS\nVisual review            REVIEW REQUIRED</pre>',publish:'<p>图文发布预览</p><pre>春季通勤｜三件真正会重复穿的单品\n\n09:00 · 文案：已完成 · 视觉：待审核\n发布：待连接 / CEO 审核后人工发布</pre>',source:'<p>来源：Curis Product Blueprint 5.1<br>引用：产品研发 Workspace<br>权限：Company 内部资料<br>使用员工：开发工程师 · Codex</p>'}[S.pane]||'<p>当前对象的辅助信息。</p>';return `<aside class="pane"><div class="pane-head"><b>${{diff:'Code / Diff',html:'HTML Preview',test:'Test Result',publish:'小红书发布预览',source:'资料来源'}[S.pane]||'详情'}</b><span class="grow"></span>${btn('×','pane-close')}</div>${body}</aside>`}
function workspace(){let isDev=S.work==='dev',isX=S.work==='xhs',name=isDev?'Curis 产品研发':isX?'小红书运营':'短视频运营';let tabsX=isDev?[['overview','项目状态'],['threads','Thread']]:isX?[['overview','总览'],['calendar','发布日历'],['content','内容'],['data','数据'],['automation','自动化']]:[['overview','总览'],['plan','内容计划'],['video','视频'],['assets','素材'],['data','数据'],['automation','自动化']];let team=isDev?['pm','architect','codex','qa']:isX?['research','copy','pm','qa']:['pm','video','copy','qa'];let body;if(S.tab==='calendar')body=calendar();else if(S.tab==='automation')body=autos(isX?'日常运营':'视频发布');else if(S.tab==='data')body=`<div class="line-list">${row('平台数据','未连接 · 请在连接完成后同步','toast','未知')}${row('人工回填','本周期尚未录入','toast','未记录')}</div>`;else body=session(S.station);return `<div class="page wide"><div class="work-head"><div><div class="eyebrow">业务空间 / ${name}<span class="snapshot">示例快照</span></div><h1>${name}</h1><p>${isDev?'当前目标：完成 Desktop Shell 交互评审。':isX?'今天发什么、哪些待审核、哪些正在自动运行。':'围绕第一支视频的脚本、素材、制作、审核、发布与复盘。'}</p></div><span class="grow"></span>${btn('···','studio')}${btn(S.context?'收起上下文':'项目上下文','context')}</div>${tabs(tabsX,S.tab)}<div class="station-strip">${team.map(stationCard).join('')}</div><div class="work-body ${S.pane?'pane':''}">${body}${pane()}</div></div>`}
function calendar(){let ds=Array.from({length:21},(_,i)=>`<div class="day ${i===9?'active':''}"><b>${i+1}</b>${i===9?'<span>09:00 · 春季通勤图文<br>文案 · 待审核</span>':''}</div>`).join('');return `<section><p>发布日历 · 自动 / 手动、负责人、状态、待审核、失败与下次运行。</p><div class="calendar">${ds}</div></section>`}function autos(n){return `<section><p>自动化不是流程图：下一次运行、当前阶段、负责人、下一步、等待原因与恢复都在当前工作里。</p><div class="automation"><div class="auto"><span class="muted">明天 09:00</span><span><b>${n}</b><p>当前：研究员工分析热点；下一步：内容策划；需要我：发布前审核</p></span><span class="pill wait">待审核</span></div><div class="auto"><span class="muted">运行中</span><span><b>素材整理</b><p>负责员工：${S.work==='xhs'?'视觉':'视频制作'}；失败时可恢复或转派。</p></span><span class="pill ok">工作中</span></div></div></section>`}
function meeting(){if(S.meeting==='list')return head('会议','即将开始、需要准备与历史会议；进入后才成为完整会议工作面。')+`<div class="line-list">${row('产品方向会议','来源：完善 Curis · 3 位员工 · 等待 CEO','meeting','现在','warn')}${row('小红书周会','来源：小红书运营 · 明天 09:00 发布','meeting','明天')}</div>`;let ms=[['Lin','先覆盖首次建立 AI 公司的 CEO，能更早验证 Workspace 是否自然。','观点'],['周知','研发侧需要保留当前 Employee Session，不要重新创建聊天页。','事实 · 引用 2'],['魏然','内容办公室也需要相同的员工介入方式，但不应复制 IDE 布局。','存在分歧']].concat(S.messages.meeting||[]);return `<div class="meeting"><div class="meeting-top"><div class="eyebrow">会议 / 产品方向会议 <span class="snapshot">示例讨论</span></div><h1>产品方向会议</h1><p>来源：完善 Curis / 产品研发办公室 · 议题：首轮 Workspace 体验 · 参与：Lin、周知、魏然</p></div><div class="messages">${ms.map(x=>`<div class="msg">${ava(x[0].slice(0,1))}<div class="bubble"><b>${x[0]}</b><p>${x[1]}</p><div class="tags"><span class="tag ${x[2].includes('分歧')?'warn':''}">${x[2]}</span></div></div></div>`).join('')}</div>${S.decision?`<div class="decision"><b>Decision · 批准首轮访谈范围</b><p>Assignment：开发工程师 · Codex 更新研发 Workspace 原型。Checkpoint：明天 16:00。</p>${btn('返回开发工程师 Workstation','decision-return','','primary')}</div>`:btn('形成 Proposal','proposal','','primary')}<div class="composer"><button class="icon">＋</button><textarea id="composer" placeholder="@员工、引用资料，或继续讨论…"></textarea><button class="send" data-a="send" data-v="meeting">↑</button></div></div>`}
function studio(){let step=S.studioStep,detail=step==='overview'?'<p>编辑团队、专业界面、能力、资料、自动工作与结果回收。当前运行不会被直接覆盖。</p>':step==='impact'?'<p>影响预览：开发工程师 Workstation、Shell 交互自动交接、UI Blueprint 资料引用会受影响；当前运行版本保持不变。</p>':step==='test'?'<p>测试这次调整：Workstation 继续、Context Sidebar 收起、Diff Pane 打开均通过；真实 Runtime 未验证。</p>':'<p>待修改版本已经准备好。确认启用会切换办公室版本；恢复上一版本保留未完成工作上下文。</p>';return `<div class="page"><div class="eyebrow">业务空间 / Curis 产品研发 / 编辑办公室<span class="snapshot">Workspace Studio</span></div><div class="header"><div><h1>编辑办公室</h1><p>持续演进数字办公室；不画 Workflow DAG，不把技术配置作为普通用户语言。</p></div><span class="grow"></span>${btn('返回办公室','studio-close')}</div><div class="version"><section><span class="pill ok">当前运行版本</span><h2 style="margin-top:10px">研发办公室 · v1</h2><p>产品、架构、开发、QA Workstation；项目 / Thread / 文件上下文；结果回到 Review。</p></section><section><span class="pill wait">待修改版本</span><h2 style="margin-top:10px">研发办公室 · v1.1</h2><p>增加开发 Workstation 的 Adapter 任务与 Test Pane；尚未启用。</p></section></div>${tabs([['overview','办公室'],['impact','影响预览'],['test','测试这次调整'],['enable','确认启用']],step)}<section style="padding:18px 0;border-bottom:1px solid var(--line)">${detail}</section><div style="margin-top:14px">${step==='overview'?btn('影响预览','studio-step','data-v="impact"','primary'):step==='impact'?btn('测试这次调整','studio-step','data-v="test"','primary'):step==='test'?btn('确认启用','studio-step','data-v="enable"','primary'):btn('恢复上一版本','toast','data-msg="示例：会恢复上一稳定版本；不改变真实运行。"','primary')}</div></div>`}
function settings(){return `<div class="page"><div class="eyebrow">Settings Workspace</div><div class="header"><div><h1>设置</h1><p>设置暂时退出 Curis 六区导航；完成后返回原工作。</p></div></div><div class="settings"><aside class="setting-nav">${btn('← 返回 Curis','settings-close')}<hr style="border:0;border-top:1px solid var(--line)">${['通用','外观','公司资料','模型','连接器','数据与资料'].map(x=>`<button class="${S.settingsTab===x?'active':''}" data-a="settings-tab" data-v="${x}">${x}</button>`).join('')}</aside><section class="setting-main"><h2>${S.settingsTab}</h2><p>${S.settingsTab==='模型'?'Provider 与可用模型；示例不保存 API Key 或真实凭据。':S.settingsTab==='连接器'?'已安装项、授权、账号、权限与健康；示例不代表真实连接。':'完成这项设置后，可按返回路径继续原来的 Workspace 或装配。'}</p>${btn('测试示例配置','toast','data-msg="示例：未保存凭据，也未建立真实授权。"','primary')}</section></div></div>`}
function dialog(){if(!S.dialog)return '';return `<div class="dialog-back"><section class="dialog"><div style="display:flex"><h2>产品研究专家</h2><span class="grow"></span>${btn('×','dialog-close')}</div><p>用户研究、资料归纳与方向判断。来自市场的专家不是 Company Employee；招募后才装配岗位、责任、Workspace 与能力。</p><h2 style="margin-top:18px">能帮你做什么</h2><p>建立访谈范围、归纳资料证据、支持产品方向会议。</p>${btn('招募','toast','data-msg="示例：招募会进入公司身份与能力装配；本原型不创建 Employee。"','primary')}</section></div>`}
function overlays(){return `${S.account?`<div class="menu"><button data-a="account">齐活林 · CEO</button><button data-a="toast" data-msg="示例使用情况">使用情况</button><button data-a="toast" data-msg="示例个性化">个性化</button><button data-a="settings">设置</button><button data-a="toast" data-msg="示例帮助">帮助</button></div>`:''}${S.assistant?`<div class="overlay"><b>✦ CEO Assistant</b><p>我可以解释跨业务变化、准备决定，或带你回到具体员工与 Workspace；不会替代本地员工 Session。</p>${btn('打开产品方向会议','meeting','','primary')}</div>`:''}${S.notice?`<div class="overlay"><b>待处理</b><p>产品方向会议等待决定；小红书明天 09:00 图文待审核；外部平台数据尚未连接。</p></div>`:''}${S.toast?`<div class="toast">${S.toast}</div>`:''}`}
function render(){let ctx=!!(S.work==='dev'||S.area==='library'||S.settings)&&S.context;let body=S.settings?settings():S.studio?studio():S.work?workspace():S.area==='home'?home():S.area==='business'?business():S.area==='org'?org():S.area==='market'?market():S.area==='library'?library():meeting();document.querySelector('#app').innerHTML=`<div class="shell ${ctx?'ctx':''}">${nav()}${ctx?context():''}<div class="app">${topbar()}<main class="main">${body}</main></div></div>${dialog()}${overlays()}`}
document.addEventListener('click',e=>{let b=e.target.closest('[data-a]');if(!b)return;let a=b.dataset.a,v=b.dataset.v;if(a==='area'){S.area=v;S.work=null;S.tab=v==='org'?'structure':v==='market'?'experts':'overview';S.meeting='list';S.settings=false}else if(a==='work'){S.work=v;S.tab='overview';S.station=v==='xhs'?'copy':v==='video'?'video':'codex';S.context=true}else if(a==='tab'){S.tab=v}else if(a==='station'){S.station=v;S.work=S.work||'dev';S.tab='overview'}else if(a==='pane'){S.pane=v}else if(a==='pane-close'){S.pane=null}else if(a==='context'){S.context=!S.context}else if(a==='meeting'){S.area='meetings';S.work=null;S.meeting='room'}else if(a==='proposal'){S.messages.meeting.push(['CEO','我倾向批准首轮访谈范围，请形成责任分配。','提案']);S.decision=true}else if(a==='decision-return'){S.work='dev';S.area='business';S.station='codex';S.meeting='list';S.decision=false;S.toast='示例：Decision 已回到开发工程师当前 Session。'}else if(a==='send'){let t=document.querySelector('#composer')?.value.trim();if(t){(S.messages[v]||(S.messages[v]=[])).push(['CEO',esc(t),'']);S.toast='已追加到当前示例 Session。'}}else if(a==='studio'){S.studio=true;S.settings=false}else if(a==='studio-close'){S.studio=false;S.work='dev'}else if(a==='studio-step'){S.studioStep=v}else if(a==='account'){S.account=!S.account}else if(a==='assistant'){S.assistant=!S.assistant;S.notice=false}else if(a==='notice'){S.notice=!S.notice;S.assistant=false}else if(a==='settings'){S.settings=true;S.account=false;S.work=null;S.area='home'}else if(a==='settings-close'){S.settings=false;S.work='dev';S.area='business'}else if(a==='settings-tab'){S.settingsTab=v}else if(a==='expert'){S.dialog='expert'}else if(a==='dialog-close'){S.dialog=null}else if(a==='toast'){S.toast=b.dataset.msg||'这是一个原型提示。'}else if(a==='focus'||a==='maximize'){S.toast='示例：工作位已切换显示状态，恢复后回到团队视图。'}render();if(S.toast)setTimeout(()=>{S.toast='';render()},2800)});document.addEventListener('keydown',e=>{if(e.key==='Escape'){S.dialog=null;S.account=false;S.assistant=false;S.notice=false;S.pane=null;render()}});render();
</script></body></html>
