<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Curis · Workspace Engineering — CEO Journey High-Fidelity</title>
<style>
/* ============================================================
   Frozen Design Tokens (Curis_Design_System.md) — 单文件内联
   Dark = Frozen 默认；Light 经 data-theme="light" 切换
   ============================================================ */
:root, [data-theme="dark"] {
  color-scheme: dark;
  --ui-bg: #1a1c1f; --ui-surface: #222529; --ui-surface-2: #2b2f34;
  --ui-line: #343940; --ui-text: #f3f4f6; --ui-text-2: #a7adb6; --ui-text-3: #a3aab4;
  --ui-action-primary-bg: #32f08c; --ui-action-primary-hover: #0fdc78; --ui-action-primary-fg: #0c0c0d;
  --ui-accent: #32f08c;
  --ui-success: #3fcf86; --ui-warning: #d89a3a; --ui-danger: #e57373;
  --ui-sidebar-w: 220px; --ui-topbar-h: 52px;
  --ui-radius: 12px; --ui-radius-sm: 8px;
  --ui-shadow: 0 1px 2px rgba(0,0,0,.25); --ui-shadow-2: 0 4px 12px rgba(0,0,0,.32); --ui-shadow-3: 0 12px 32px rgba(0,0,0,.44);
  --ui-font: "Inter", system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  --ui-mono: "SF Mono", ui-monospace, "JetBrains Mono", monospace;
  --ui-fs-1: 12px; --ui-fs-2: 13px; --ui-fs-3: 14px; --ui-fs-4: 16px; --ui-fs-5: 20px; --ui-fs-6: 24px; --ui-fs-7: 28px;
}
[data-theme="light"] {
  color-scheme: light;
  --ui-bg: #f5f5f7; --ui-surface: #ffffff; --ui-surface-2: #f7f8fa;
  --ui-line: #e5e7eb; --ui-text: #1a1c1f; --ui-text-2: #4b5563; --ui-text-3: #626b76;
  --ui-action-primary-bg: #30333a; --ui-action-primary-hover: #17181a; --ui-action-primary-fg: #ffffff;
  --ui-accent: #1a1c1f; --ui-success: #21895d; --ui-warning: #b87922; --ui-danger: #c43f3f;
  --ui-shadow: 0 1px 2px rgba(15,18,35,.05); --ui-shadow-2: 0 4px 12px rgba(15,18,35,.08); --ui-shadow-3: 0 12px 32px rgba(15,18,35,.12);
}
:root {
  --ui-sp-1: 4px; --ui-sp-2: 8px; --ui-sp-3: 12px; --ui-sp-4: 16px; --ui-sp-5: 20px; --ui-sp-6: 24px; --ui-sp-7: 32px; --ui-sp-8: 48px;
  --ui-r-xs: 4px; --ui-r-sm: 8px; --ui-r-md: 12px; --ui-r-lg: 16px; --ui-r-pill: 999px;
  --ui-z-base: 0; --ui-z-sticky: 100; --ui-z-dropdown: 200; --ui-z-drawer: 300; --ui-z-modal: 400; --ui-z-toast: 500; --ui-z-devmode: 9000;
  --ui-dur-1: 120ms; --ui-dur-2: 200ms; --ui-dur-3: 320ms;
  --ui-ease-standard: cubic-bezier(.2,0,0,1);
  --ui-focus-w: 2px; --ui-focus-offset: 2px; --ui-focus-color: var(--ui-accent);
  --ui-ctl-h-sm: 32px; --ui-ctl-h: 36px; --ui-ctl-h-lg: 40px; --ui-tap-min: 32px;
  --ui-lh-tight: 1.25; --ui-lh: 1.5; --ui-lh-loose: 1.7;
}
html { font-size: 16px; }
body { font-size: var(--ui-fs-3); margin:0; background: var(--ui-bg); color: var(--ui-text); font-family: var(--ui-font); line-height: var(--ui-lh); }
h1{font-size:var(--ui-fs-6);margin:0} h2{font-size:var(--ui-fs-5);margin:0} h3{font-size:var(--ui-fs-4);margin:0} h4{font-size:var(--ui-fs-3);margin:0}
small{font-size:var(--ui-fs-1)}
button, input, select, textarea{font-family:inherit;font-size:var(--ui-fs-2)}
:where(a,button,select,input,textarea,summary,[tabindex]):focus-visible{outline:var(--ui-focus-w) solid var(--ui-focus-color);outline-offset:var(--ui-focus-offset);border-radius:var(--ui-r-xs)}

/* ---------- Presentation wrapper (评审层，非产品) ---------- */
.presbar{position:sticky;top:0;z-index:var(--ui-z-sticky);display:flex;align-items:center;gap:var(--ui-sp-3);padding:var(--ui-sp-3) var(--ui-sp-4);background:var(--ui-surface);border-bottom:1px solid var(--ui-line)}
.presbar .brand{display:flex;align-items:center;gap:var(--ui-sp-2);font-weight:600}
.presbar .brand .mk{width:24px;height:24px;border-radius:var(--ui-r-sm);background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);display:grid;place-items:center;font-weight:700}
.presbar .steps{display:flex;gap:var(--ui-sp-1);overflow:auto;flex:1}
.step-chip{border:1px solid var(--ui-line);background:var(--ui-surface-2);color:var(--ui-text-2);border-radius:var(--ui-r-pill);padding:var(--ui-sp-1) var(--ui-sp-3);white-space:nowrap;cursor:pointer;font-size:var(--ui-fs-1)}
.step-chip.active{background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);border-color:transparent;font-weight:600}
.step-chip:hover{color:var(--ui-text)}
.pres-sub{padding:var(--ui-sp-2) var(--ui-sp-4);background:var(--ui-surface-2);border-bottom:1px solid var(--ui-line);color:var(--ui-text-2);font-size:var(--ui-fs-2);display:flex;gap:var(--ui-sp-2);align-items:center}
.pres-sub b{color:var(--ui-text)}
.theme-toggle{border:1px solid var(--ui-line);background:var(--ui-surface-2);color:var(--ui-text);border-radius:var(--ui-r-sm);height:var(--ui-ctl-h-sm);padding:0 var(--ui-sp-3);cursor:pointer;font-size:var(--ui-fs-1)}

/* ---------- App window (产品窗口) ---------- */
.desk{padding:var(--ui-sp-6);display:flex;justify-content:center}
.app{width:min(1180px,100%);height:760px;border:1px solid var(--ui-line);border-radius:var(--ui-r-lg);overflow:hidden;box-shadow:var(--ui-shadow-3);background:var(--ui-bg)}
.shell{display:grid;grid-template-columns:var(--ui-sidebar-w) 0 1fr 0;height:100%;transition:grid-template-columns var(--ui-dur-2) var(--ui-ease-standard)}
.shell.ctx-open{grid-template-columns:var(--ui-sidebar-w) 340px 1fr 0}
.shell.util-open{grid-template-columns:var(--ui-sidebar-w) 0 1fr 360px}
.shell.ctx-open.util-open{grid-template-columns:var(--ui-sidebar-w) 300px 1fr 340px}
.shell.nav-collapsed{grid-template-columns:0 0 1fr 0}
.shell.nav-collapsed.ctx-open{grid-template-columns:0 340px 1fr 0}
.shell.nav-collapsed.util-open{grid-template-columns:0 0 1fr 360px}
.shell.nav-collapsed.ctx-open.util-open{grid-template-columns:0 300px 1fr 340px}
.pane{min-width:0;min-height:0;overflow:hidden;display:flex;flex-direction:column}
.pane-nav{background:var(--ui-surface);border-right:1px solid var(--ui-line)}
.pane-ctx{background:var(--ui-surface);border-right:1px solid var(--ui-line)}
.pane-util{background:var(--ui-surface);border-left:1px solid var(--ui-line)}
.pane-main{background:var(--ui-bg)}
.pane-head{display:flex;align-items:center;gap:var(--ui-sp-2);height:var(--ui-topbar-h);padding:0 var(--ui-sp-3);border-bottom:1px solid var(--ui-line);flex:none}
.pane-body{flex:1;min-height:0;overflow:auto;padding:var(--ui-sp-4)}
.nav-head{justify-content:space-between}
.tl{display:flex;gap:6px}
.tl i{width:11px;height:11px;border-radius:50%;display:block}
.tl .r{background:#ec6a5e}.tl .y{background:#f4bf4f}.tl .g{background:#61c554}
.icon-btn{width:var(--ui-ctl-h-sm);height:var(--ui-ctl-h-sm);display:grid;place-items:center;border:1px solid var(--ui-line);background:transparent;color:var(--ui-text-2);border-radius:var(--ui-r-sm);cursor:pointer}
.icon-btn:hover{color:var(--ui-text);border-color:var(--ui-text-3)}
.brandrow{display:flex;align-items:center;gap:var(--ui-sp-2);font-weight:600;padding:var(--ui-sp-3);border-bottom:1px solid var(--ui-line)}
.brandrow .mk{width:24px;height:24px;border-radius:var(--ui-r-sm);background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);display:grid;place-items:center;font-weight:700}
.nav-group{padding:var(--ui-sp-2)}
.nav-label{margin:var(--ui-sp-3) var(--ui-sp-2) var(--ui-sp-1);font-size:var(--ui-fs-1);color:var(--ui-text-3);text-transform:uppercase;letter-spacing:.04em}
.nav-item{display:flex;align-items:center;gap:var(--ui-sp-2);padding:var(--ui-sp-2) var(--ui-sp-3);border-radius:var(--ui-r-sm);color:var(--ui-text-2);text-decoration:none;font-size:var(--ui-fs-2);cursor:pointer}
.nav-item:hover{background:var(--ui-surface-2);color:var(--ui-text)}
.nav-item.active{background:var(--ui-surface-2);color:var(--ui-text);font-weight:600}
.nav-item .nb{margin-left:auto;background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);border-radius:var(--ui-r-pill);font-size:var(--ui-fs-1);padding:0 var(--ui-sp-2);min-width:18px;text-align:center}
.nav-item .ni{width:18px;height:18px;display:grid;place-items:center;color:var(--ui-text-3)}
.nav-foot{margin-top:auto;padding:var(--ui-sp-2);border-top:1px solid var(--ui-line);display:grid;gap:var(--ui-sp-1)}
.breadcrumb{display:flex;align-items:center;gap:var(--ui-sp-2);font-size:var(--ui-fs-2);color:var(--ui-text-2);flex:1;min-width:0;overflow:hidden;white-space:nowrap}
.breadcrumb b{color:var(--ui-text)}
.toggles{display:flex;gap:var(--ui-sp-1)}
.main-head{justify-content:space-between}
.empty-hint{color:var(--ui-text-3);font-size:var(--ui-fs-2);padding:var(--ui-sp-4);text-align:center}

/* ---------- Components ---------- */
.card{background:var(--ui-surface);border:1px solid var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-4)}
.card.soft{background:var(--ui-surface-2)}
.hrow{display:flex;align-items:center;gap:var(--ui-sp-2);margin-bottom:var(--ui-sp-3)}
.hrow h3{font-size:var(--ui-fs-4)}
.muted{color:var(--ui-text-2)}
.dim{color:var(--ui-text-3)}
.pill{display:inline-flex;align-items:center;gap:var(--ui-sp-1);border-radius:var(--ui-r-pill);padding:2px var(--ui-sp-3);font-size:var(--ui-fs-1);border:1px solid var(--ui-line);background:var(--ui-surface-2);color:var(--ui-text-2)}
.pill.green{background:rgba(50,240,140,.14);color:var(--ui-success);border-color:transparent}
.pill.warn{background:rgba(216,154,58,.16);color:var(--ui-warning);border-color:transparent}
.pill.danger{background:rgba(229,115,115,.16);color:var(--ui-danger);border-color:transparent}
.pill.solid{background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);border-color:transparent;font-weight:600}
.btn{height:var(--ui-ctl-h);padding:0 var(--ui-sp-4);border-radius:var(--ui-r-sm);border:1px solid var(--ui-line);background:var(--ui-surface-2);color:var(--ui-text);cursor:pointer;font-size:var(--ui-fs-2)}
.btn:hover{border-color:var(--ui-text-3)}
.btn.primary{background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);border-color:transparent;font-weight:600}
.btn.primary:hover{background:var(--ui-action-primary-hover)}
.btn.lg{height:var(--ui-ctl-h-lg);padding:0 var(--ui-sp-5);font-size:var(--ui-fs-3)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;gap:var(--ui-sp-3);align-items:center}
.col{display:flex;flex-direction:column;gap:var(--ui-sp-3)}
.wrap{display:flex;flex-wrap:wrap;gap:var(--ui-sp-2)}
.stack{display:flex;flex-direction:column;gap:var(--ui-sp-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:var(--ui-sp-3)}
.divider{height:1px;background:var(--ui-line);margin:var(--ui-sp-4) 0}
.field-input{width:100%;background:var(--ui-surface-2);border:1px solid var(--ui-line);border-radius:var(--ui-r-sm);color:var(--ui-text);padding:var(--ui-sp-3);font-size:var(--ui-fs-3);resize:none}
.chip-opt{border:1px solid var(--ui-line);background:var(--ui-surface-2);color:var(--ui-text-2);border-radius:var(--ui-r-pill);padding:var(--ui-sp-2) var(--ui-sp-4);cursor:pointer;font-size:var(--ui-fs-2)}
.chip-opt:hover{border-color:var(--ui-text-3);color:var(--ui-text)}
.chip-opt.on{background:rgba(50,240,140,.14);color:var(--ui-success);border-color:transparent}

/* timeline */
.tl-item{display:flex;gap:var(--ui-sp-3);padding:var(--ui-sp-2) 0}
.tl-dot{width:10px;height:10px;border-radius:50%;margin-top:5px;flex:none;background:var(--ui-line)}
.tl-dot.done{background:var(--ui-success)}
.tl-dot.active{background:var(--ui-accent);box-shadow:0 0 0 3px rgba(50,240,140,.2)}
.tl-line{flex:1;border-left:1px solid var(--ui-line);margin-left:4px;padding-left:var(--ui-sp-3);padding-bottom:var(--ui-sp-2)}

/* employee presence (P2) */
.emp{border:1px solid var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-3);display:flex;gap:var(--ui-sp-3);align-items:center;background:var(--ui-surface)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ui-surface-2);display:grid;place-items:center;font-weight:600;color:var(--ui-text);flex:none}
.emp .role{font-weight:600}
.emp .doing{color:var(--ui-text-2);font-size:var(--ui-fs-2)}
.presence-dot{width:8px;height:8px;border-radius:50%;background:var(--ui-success);display:inline-block;margin-right:6px}

/* proposal */
.prop-q{color:var(--ui-text-3);font-size:var(--ui-fs-2);margin-bottom:2px}
.prop-a{font-size:var(--ui-fs-3);margin-bottom:var(--ui-sp-4)}
.prop-a b{color:var(--ui-text)}
.banner-ok{background:rgba(50,240,140,.12);border:1px solid rgba(50,240,140,.3);color:var(--ui-success);border-radius:var(--ui-r-md);padding:var(--ui-sp-4);font-weight:600;font-size:var(--ui-fs-4)}

/* capability three-class */
.cap{border:1px solid var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-4);background:var(--ui-surface)}
.cap h4{margin-bottom:var(--ui-sp-2)}
.cap .kind{font-size:var(--ui-fs-1);text-transform:uppercase;letter-spacing:.05em;margin-bottom:var(--ui-sp-2)}
.cap.act .kind{color:var(--ui-danger)}
.cap.act{border-color:rgba(229,115,115,.4)}
.cap.spec .kind{color:var(--ui-warning)}
.cap.opt .kind{color:var(--ui-success)}

/* need CEO (P7) */
.needs-ceo{background:var(--ui-surface);border:1px solid var(--ui-line);border-left:3px solid var(--ui-accent);border-radius:var(--ui-r-md);padding:var(--ui-sp-4)}
.needs-ceo .layer0{display:flex;align-items:center;gap:var(--ui-sp-2);font-weight:600;margin-bottom:var(--ui-sp-2)}
.needs-ceo .layer1{color:var(--ui-text-2);font-size:var(--ui-fs-2)}

/* gap card (empty/failure/gap) */
.gap{border:1px dashed var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-4);background:var(--ui-surface-2)}
.gap.fail{border-style:solid;border-color:rgba(229,115,115,.4)}
.gap .ttl{font-weight:600;margin-bottom:var(--ui-sp-1)}
.gap .desc{color:var(--ui-text-2);font-size:var(--ui-fs-2)}

/* result reference (P6) */
.result{border:1px solid var(--ui-line);border-radius:var(--ui-r-sm);padding:var(--ui-sp-3);display:flex;gap:var(--ui-sp-3);align-items:center;background:var(--ui-surface)}
.result .thumb{width:48px;height:48px;border-radius:var(--ui-r-sm);background:var(--ui-surface-2);flex:none;display:grid;place-items:center;color:var(--ui-text-3)}
.evi{display:flex;align-items:center;gap:var(--ui-sp-2);padding:var(--ui-sp-2) 0;font-size:var(--ui-fs-2);color:var(--ui-text-2);border-bottom:1px solid var(--ui-line)}
.evi:last-child{border-bottom:0}
.kv{display:flex;justify-content:space-between;padding:var(--ui-sp-2) 0;border-bottom:1px solid var(--ui-line);font-size:var(--ui-fs-2)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ui-text-3)}
.progress{height:8px;background:var(--ui-surface-2);border-radius:var(--ui-r-pill);overflow:hidden}
.progress>i{display:block;height:100%;background:var(--ui-action-primary-bg)}
.intg{display:flex;gap:var(--ui-sp-2);flex-wrap:wrap;margin-top:var(--ui-sp-3)}
.intg .pill{font-size:var(--ui-fs-1)}
.tag-new{background:var(--ui-action-primary-bg);color:var(--ui-action-primary-fg);border-radius:var(--ui-r-pill);font-size:var(--ui-fs-1);padding:1px var(--ui-sp-2);margin-left:6px;font-weight:600}
/* design fixture note (Content Growth 示例数据标注) */
.fixture{display:flex;align-items:flex-start;gap:var(--ui-sp-2);margin-top:var(--ui-sp-3);padding:var(--ui-sp-2) var(--ui-sp-3);border:1px dashed var(--ui-line);border-radius:var(--ui-r-sm);color:var(--ui-text-3);font-size:var(--ui-fs-1);line-height:var(--ui-lh)}
.fixture b{color:var(--ui-warning)}

/* Team Operating Model — 部门 / 责任分工 / 交接 / 对话工位 */
.dept{border:1px solid var(--ui-line);border-left:3px solid var(--ui-accent);border-radius:var(--ui-r-md);padding:var(--ui-sp-4);background:var(--ui-surface)}
.dept .dname{font-weight:600;font-size:var(--ui-fs-4)}
.dept .drole{color:var(--ui-text-2);font-size:var(--ui-fs-2);margin-top:2px}
.resp{border:1px solid var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-3) var(--ui-sp-4);background:var(--ui-surface);cursor:pointer}
.resp:hover{border-color:var(--ui-text-3)}
.resp .rhead{display:flex;align-items:center;gap:var(--ui-sp-2);font-weight:600}
.resp .rhead .num{width:22px;height:22px;border-radius:50%;background:var(--ui-surface-2);display:grid;place-items:center;font-size:var(--ui-fs-1);color:var(--ui-text-2);flex:none}
.resp .rresult{color:var(--ui-text-2);font-size:var(--ui-fs-2);margin-top:6px}
.handoff{display:flex;align-items:center;gap:var(--ui-sp-2);color:var(--ui-text-3);font-size:var(--ui-fs-2);margin:var(--ui-sp-2) 0;padding-left:var(--ui-sp-5)}
.handoff .arrow{color:var(--ui-accent);font-weight:700}
.coord{border:1px dashed var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-3);background:var(--ui-surface-2);font-size:var(--ui-fs-2);color:var(--ui-text-2)}
.coord b{color:var(--ui-text)}
.msg{border:1px solid var(--ui-line);border-radius:var(--ui-r-md);padding:var(--ui-sp-3);background:var(--ui-surface-2)}
.msg b{color:var(--ui-text)}
.emp{cursor:pointer}
.emp:hover{border-color:var(--ui-text-3)}
</style>
</head>
<body>
<div class="presbar">
  <div class="brand"><span class="mk">C</span> Curis · Workspace Engineering</div>
  <div class="steps" id="steps"></div>
  <button class="theme-toggle" id="themeBtn">切换明/暗</button>
</div>
<div class="pres-sub" id="sub"></div>
<div class="desk">
  <div class="app"><div id="app"></div></div>
</div>

<script>
/* ====================== 数据：旅程步骤 ====================== */
const STEPS = [
  {key:"home",     label:"经营总览",   title:"经营总览（起点）",     desc:"所有经营方向与业务空间的聚合入口；从这里发起「创办新业务」，可委托空间工程部或自行创建。"},
  {key:"intent",   label:"表达意图",   title:"表达经营意图",         desc:"轻量引导：用一句话或自然语言选项说出「想经营什么结果 / 怎样算成功」；可由你直接委托空间工程部，或由 Assistant 理解后转交。"},
  {key:"delegate", label:"委托与澄清", title:"委托空间工程部 · 目标澄清", desc:"空间工程部作为 Curis 组织真实核心 Department 出现；Assistant 协调转交，Leader 与你通过 Conversation 澄清目标 / 成功 / 范围 / Non-goals。"},

function renderNav(active, offices){

  let h = '<div class="brandrow"><span class="mk">C</span> Curis</div>';

  persistent.forEach(([n,href])=>{

  const base = [["研发办公室","workspace-runtime-software.html"]];
  const all = base.concat(offices);
  all.forEach(([n,href])=>{
    const on = href===active ? ' active':'';

    const tag = isNew ? '<span class="tag-new">新</span>' : '';

function shell(f){
  const cls = ['shell'];
  if(state.ctxOpen) cls.push('ctx-open');

  if(state.navCollapsed) cls.push('nav-collapsed');
  return `<div class="${cls.join(' ')}" style="height:100%">
    <div class="pane pane-nav">${paneHeadNav()}<div class="pane-body" style="padding:0">${renderNav(f.active, f.offices||[])}</div></div>
    ${state.ctxOpen?`<div class="pane pane-ctx">${paneHeadCtx('上下文')}<div class="pane-body">${f.ctx||''}</div></div>`:''}
    <div class="pane pane-main">${paneHeadMain(f.breadcrumb)}<div class="pane-body">${f.main||''}</div></div>
    ${state.utilOpen?`<div class="pane pane-util">${paneHeadUtil('工具面')}<div class="pane-body">${f.util||''}</div></div>`:''}
  </div>`;
}
function render(){
  const f = BUILD[STEPS[state.step].key]();
  // 应用 frame 自带的开合偏好（working/home2 默认开）
  if(f.ctxOpen!==undefined) state.ctxOpen = f.ctxOpen;
  if(f.utilOpen!==undefined) state.utilOpen = f.utilOpen;
  // CEO 介入：点击员工进入其 Workstation / Conversation（覆盖 Context）
  if(state.workstation){ f.ctx = sWorkstation(state.workstation); f.ctxOpen = true; }
  document.getElementById('app').innerHTML = shell(f);
  document.getElementById('sub').innerHTML = `<b>步骤 ${state.step+1}/${STEPS.length} · ${STEPS[state.step].title}</b> &nbsp; ${STEPS[state.step].desc}`;
  // 步骤条
  const steps = document.getElementById('steps');
  steps.innerHTML = STEPS.map((s,i)=>`<button class="step-chip ${i===state.step?'active':''}" onclick="go(${i})">${s.label}</button>`).join('');
  // 绑定 toggle
  const t1=document.getElementById('t1'); if(t1) t1.onclick=()=>{state.navCollapsed=!state.navCollapsed;render();};
  const t2=document.getElementById('t2'); if(t2) t2.onclick=()=>{ state.ctxOpen=!state.ctxOpen; if(!state.ctxOpen) state.workstation=null; render(); };
  const t3=document.getElementById('t3'); if(t3) t3.onclick=()=>{state.utilOpen=!state.utilOpen;render();};
  const t3b=document.getElementById('t3b'); if(t3b) t3b.onclick=()=>{state.utilOpen=false;render();};
}
function go(i){ state.step = i; state.workstation=null; render(); }
function connect(){ state.connected = true; const b=document.getElementById('actBtn'); if(b){b.disabled=false;} render(); }

};
