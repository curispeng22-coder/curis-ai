<!doctype html>
<html lang="zh-CN">
<head>

  <title>会议工作台 · 外部合作方周会 · Curis</title>
  <style>
    :root { --bg:#191a1d; --panel:#202226; --panel2:#25272b; --text:#e2e3e7; --muted:#a4a7af; --faint:#777c86; --line:rgba(224,226,242,.12); --primary:#d9dbe1; --primaryText:#17181a; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; color:var(--text); background:var(--bg); }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; background:var(--bg); }
    .shell { display:flex; min-height:100vh; }
    .sidebar { width:220px; flex:0 0 220px; padding:22px 14px; border-right:1px solid var(--line); background:#1c1d20; }
    .brand { display:flex; align-items:center; gap:9px; padding:0 10px 26px; font-size:15px; font-weight:650; }
    .brand-mark { display:grid; place-items:center; width:22px; height:22px; border-radius:6px; color:var(--primaryText); background:var(--primary); font-size:11px; font-weight:800; }
    .nav-label { margin:0 10px 7px; color:var(--faint); font-size:10px; letter-spacing:.06em; text-transform:uppercase; }
    .nav { display:grid; gap:3px; }
    .nav-item { display:flex; align-items:center; gap:9px; padding:9px 10px; color:var(--muted); border-radius:7px; font-size:12px; text-decoration:none; }
    .nav-item:hover,.nav-item.active { color:var(--text); background:rgba(224,226,242,.06); }
    .nav-icon { width:14px; color:var(--faint); text-align:center; }
    .nav-item.active .nav-icon { color:var(--text); }
    .sidebar-foot { position:absolute; bottom:20px; width:190px; color:var(--faint); font-size:10px; line-height:1.5; }
    .main { min-width:0; flex:1; }
    .topbar { display:flex; align-items:center; justify-content:space-between; gap:16px; min-height:62px; padding:0 32px; border-bottom:1px solid var(--line); }
    .crumbs { display:flex; align-items:center; gap:9px; color:var(--muted); font-size:11px; }
    .crumbs strong { color:var(--text); font-weight:600; }
    .top-meta { color:var(--faint); font-size:10px; }
    .content { max-width:1240px; margin:0 auto; padding:32px; }
    .page-header { display:flex; justify-content:space-between; gap:20px; margin-bottom:24px; }
    .eyebrow { margin:0 0 8px; color:var(--muted); font-size:10px; letter-spacing:.08em; text-transform:uppercase; }
    h1 { margin:0; font-size:25px; font-weight:620; letter-spacing:-.02em; }
    .subtitle { max-width:650px; margin:8px 0 0; color:var(--muted); font-size:12px; line-height:1.6; }
    .status { align-self:flex-start; padding:6px 9px; color:#a8c8b8; border:1px solid rgba(168,200,184,.25); border-radius:999px; font-size:10px; white-space:nowrap; }
    @media (max-width:760px) { .sidebar { width:64px; flex-basis:64px; padding:18px 8px; } .brand span,.nav-label,.nav-item span:not(.nav-icon),.sidebar-foot { display:none; } .nav-item { justify-content:center; } .topbar,.content { padding-left:18px; padding-right:18px; } .page-header { flex-direction:column; } }
  </style>
</head>
<body>

        <a class="nav-item" href="decision-room.html"><span class="nav-icon">◇</span><span>决策室</span></a>
      </nav>
      <div class="sidebar-foot">事实先于观点。<br />共识必须回到责任与结果。</div>

        </header>
        <div class="meeting-anchor"></div>

    </div>
  </div>
  <script src="curis-prototype.js"></script>
</body>
