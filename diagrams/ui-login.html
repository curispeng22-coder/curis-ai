<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Curis Workspace — 登录</title>
<style>
:root{
  --t50:#F0FDFA;--t100:#CCFBF1;--t300:#5EEAD4;--t400:#2DD4BF;--t500:#14B8A6;--t600:#0D9488;--t700:#0F766E;--t800:#115E59;
  --bg:#F7FCFA;--card:#FFF;--sub:#EDF7F5;--sb-bg:#FAFEFD;
  --tx:#0F2922;--tx2:#4A635C;--tx3:#7B9590;
  --ok:#10B981;--ok-bg:#ECFDF5;--warn:#F59E0B;--warn-bg:#FFFBEB;--err:#EF4444;--err-bg:#FEF2F2;--info:#06B6D4;--info-bg:#ECFEFF;--pur:#8B5CF6;--pur-bg:#F5F3FF;--blu:#3B82F6;--bd:#DEF2EC;--bd2:#C5E5DB;
  --sh-sm:0 1px 2px rgba(15,41,34,.04);--sh-md:0 4px 12px rgba(15,41,34,.07);--sh-lg:0 12px 32px rgba(15,41,34,.10);
  --rs:8px;--rm:12px;--rl:16px;--rxl:20px;--rp:999px;
  --font:"Inter","PingFang SC","Microsoft YaHei",system-ui,sans-serif;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:15px;-webkit-font-smoothing:antialiased}
body{font-family:var(--font);background:var(--bg);color:var(--tx);line-height:1.55;height:100vh;overflow:hidden}

.login{display:flex;height:100vh}
/* ===== Left brand panel ===== */
.brand-pane{
  width:46%;min-width:380px;position:relative;overflow:hidden;
  background:linear-gradient(155deg,#0F766E 0%,#14B8A6 52%,#2DD4BF 100%);
  color:#fff;display:flex;flex-direction:column;justify-content:space-between;
  padding:48px 52px;
}
.brand-pane::before{content:"";position:absolute;top:-120px;right:-120px;width:360px;height:360px;border-radius:50%;background:rgba(255,255,255,.10)}
.brand-pane::after{content:"";position:absolute;bottom:-160px;left:-80px;width:420px;height:420px;border-radius:50%;background:rgba(255,255,255,.07)}
.bp-top{display:flex;align-items:center;gap:12px;position:relative;z-index:1}
.bp-logo{width:46px;height:46px;border-radius:13px;background:rgba(255,255,255,.16);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:22px;box-shadow:0 4px 14px rgba(0,0,0,.12)}
.bp-logo-txt h1{font-size:20px;font-weight:800;letter-spacing:.4px}
.bp-logo-txt p{font-size:12.5px;opacity:.82;margin-top:2px}

.bp-mid{position:relative;z-index:1;max-width:420px}
.bp-mid h2{font-size:34px;font-weight:800;line-height:1.25;letter-spacing:.3px}
.bp-mid h2 em{font-style:normal;color:#CCFBF1}
.bp-mid>p{font-size:15px;opacity:.88;margin-top:16px;line-height:1.7}

.bp-feats{display:flex;flex-direction:column;gap:14px;margin-top:34px}
.bpf{display:flex;align-items:center;gap:14px}
.bpf-ic{width:40px;height:40px;flex-shrink:0;border-radius:11px;background:rgba(255,255,255,.15);display:flex;align-items:center;justify-content:center}
.bpf-ic svg{width:20px;height:20px;color:#fff}
.bpf-tx strong{display:block;font-size:14px;font-weight:700}
.bpf-tx span{font-size:12.5px;opacity:.82}

.bp-bottom{position:relative;z-index:1;display:flex;align-items:center;gap:10px;font-size:12.5px;opacity:.82}
.bp-dot{width:8px;height:8px;border-radius:50%;background:#A7F3D0;box-shadow:0 0 8px rgba(167,243,208,.7)}

/* ===== Right form panel ===== */
.form-pane{flex:1;display:flex;align-items:center;justify-content:center;padding:32px;background:var(--bg)}
.form-card{width:100%;max-width:400px}
.fc-head{margin-bottom:30px}
.fc-head h3{font-size:26px;font-weight:800;letter-spacing:.2px}
.fc-head p{font-size:14px;color:var(--tx3);margin-top:8px}
.fc-head a{color:var(--t600);font-weight:600;text-decoration:none}

.field{margin-bottom:18px}
.field label{display:block;font-size:13px;font-weight:600;color:var(--tx2);margin-bottom:7px}
.input{display:flex;align-items:center;gap:10px;background:var(--card);border:1.5px solid var(--bd);border-radius:var(--rm);padding:0 14px;height:50px;transition:all .15s}
.input:focus-within{border-color:var(--t400);box-shadow:0 0 0 3px rgba(45,212,191,.14)}
.input svg{width:18px;height:18px;color:var(--tx3);flex-shrink:0}
.input input{flex:1;border:none;outline:none;font-size:14.5px;font-family:var(--font);color:var(--tx);background:transparent;min-width:0}
.input input::placeholder{color:#A9BCB6}
.input .toggle{cursor:pointer;color:var(--tx3);display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:6px}
.input .toggle:hover{background:var(--sub);color:var(--t600)}

.row{display:flex;align-items:center;justify-content:space-between;margin:6px 0 22px}
.remember{display:flex;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;color:var(--tx2);user-select:none}
.remember input{appearance:none;width:18px;height:18px;border:1.5px solid var(--bd2);border-radius:5px;cursor:pointer;position:relative;transition:all .15s}
.remember input:checked{background:var(--t500);border-color:var(--t500)}
.remember input:checked::after{content:"";position:absolute;left:5px;top:1.5px;width:5px;height:9px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.remember input:focus-visible{outline:2px solid var(--t500);outline-offset:2px}
.forgot{font-size:13.5px;color:var(--t600);font-weight:600;text-decoration:none}
.forgot:hover{text-decoration:underline}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;height:50px;border:none;border-radius:var(--rm);font-family:var(--font);font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.btn-primary{background:linear-gradient(135deg,var(--t500),var(--t600));color:#fff;box-shadow:0 6px 18px rgba(13,148,136,.28)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 10px 24px rgba(13,148,136,.34)}
.btn-primary:active{transform:translateY(0)}
.btn-primary:focus-visible{outline:2px solid var(--t700);outline-offset:2px}

.divider{display:flex;align-items:center;gap:14px;margin:26px 0}
.divider::before,.divider::after{content:"";flex:1;height:1px;background:var(--bd)}
.divider span{font-size:12.5px;color:var(--tx3);font-weight:500}

.social{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sbtn{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;height:62px;border:1.5px solid var(--bd);border-radius:var(--rm);background:var(--card);cursor:pointer;transition:all .15s;color:var(--tx2)}
.sbtn:hover{border-color:var(--t300);background:var(--sub);transform:translateY(-1px)}
.sbtn svg{width:22px;height:22px}
.sbtn span{font-size:12px;font-weight:600}
.sbtn.g svg{color:#EA4335}.sbtn.gh svg{color:#181717}.sbtn.wx svg{color:#07C160}

.signup{text-align:center;font-size:13.5px;color:var(--tx3);margin-top:26px}
.signup a{color:var(--t600);font-weight:700;text-decoration:none}
.signup a:hover{text-decoration:underline}

@media(max-width:880px){
  body{overflow:auto;height:auto}
  .login{height:auto;min-height:100vh}
  .brand-pane{display:none}
  .form-pane{padding:48px 24px}
}
@media(max-width:420px){
  .social{grid-template-columns:1fr 1fr 1fr}
  .fc-head h3{font-size:22px}
}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="login">
  <!-- Left brand panel -->
  <aside class="brand-pane">
    <div class="bp-top">
      <div class="bp-logo">C</div>
      <div class="bp-logo-txt"><h1>Curis Workspace</h1><p>一人公司的操作系统</p></div>
    </div>

    <div class="bp-mid">
      <h2>你只需要做<em> CEO</em>，<br/>其余交给你的 AI 公司</h2>
      <p>配置你自己的部门、员工与经营平台，让 AI 自动跑通从任务到收益的全流程。每个登录者都是独立的经营者。</p>

      <div class="bp-feats">
        <div class="bpf">
          <div class="bpf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg></div>
          <div class="bpf-tx"><strong>部门即积木</strong><span>业务部 / 文案部 / 人事部自由组合</span></div>
        </div>
        <div class="bpf">
          <div class="bpf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 00-4-4H5a4 4 0 00-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 00-3-3.87"/></svg></div>
          <div class="bpf-tx"><strong>员工自动协作</strong><span>AI 员工按角色执行、汇报、学习</span></div>
        </div>
        <div class="bpf">
          <div class="bpf-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v18h18"/><polyline points="7 14 11 10 15 16 19 6"/></svg></div>
          <div class="bpf-tx"><strong>收益与 ROI 可视</strong><span>每个部门、每位员工的产出一目了然</span></div>
        </div>
      </div>
    </div>

    <div class="bp-bottom"><span class="bp-dot"></span> 系统运行正常 · v0.3 · 本地安全部署</div>
  </aside>

  <!-- Right form panel -->
  <main class="form-pane">
    <div class="form-card">
      <div class="fc-head">
        <h3>欢迎回来 👋</h3>
        <p>登录以进入你的公司驾驶舱 · <a href="#">需要帮助？</a></p>
      </div>

      <form onsubmit="return false">
        <div class="field">
          <label for="acct">邮箱 / 手机号</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h16a2 2 0 012 2v12a2 2 0 01-2 2H4a2 2 0 01-2-2V6a2 2 0 012-2z"/><polyline points="22,6 12,13 2,6"/></svg>
            <input id="acct" type="text" placeholder="you@company.com" autocomplete="username"/>
          </div>
        </div>

        <div class="field">
          <label for="pwd">密码</label>
          <div class="input">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
            <input id="pwd" type="password" placeholder="输入登录密码" autocomplete="current-password"/>
            <span class="toggle" aria-label="显示密码" onclick="const i=document.getElementById('pwd');i.type=i.type==='password'?'text':'password'">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </span>
          </div>
        </div>

        <div class="row">
          <label class="remember"><input type="checkbox" checked/> 记住我</label>
          <a class="forgot" href="#">忘记密码？</a>
        </div>

        <button class="btn btn-primary" type="submit">登录</button>
      </form>

      <div class="divider"><span>或使用以下方式登录</span></div>

      <div class="social">
        <button class="sbtn g" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.35 11.1H12v2.92h5.35c-.23 1.38-1.6 4.04-5.35 4.04-3.22 0-5.85-2.66-5.85-5.95S8.78 6.16 12 6.16c1.83 0 3.06.78 3.76 1.45l2.56-2.47C16.8 3.5 14.6 2.5 12 2.5 6.87 2.5 2.75 6.62 2.75 11.75S6.87 20.99 12 20.99c6.09 0 10.12-4.27 10.12-10.29 0-.69-.07-1.22-.2-1.6z"/></svg>
          <span>Google</span>
        </button>
        <button class="sbtn gh" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 .5C5.37.5 0 5.87 0 12.5c0 5.3 3.44 9.8 8.21 11.39.6.11.82-.26.82-.58v-2.02c-3.34.73-4.04-1.61-4.04-1.61-.55-1.39-1.34-1.76-1.34-1.76-1.09-.75.08-.73.08-.73 1.2.08 1.84 1.24 1.84 1.24 1.07 1.83 2.81 1.30 3.50.99.11-.78.42-1.30.76-1.60-2.67-.30-5.47-1.33-5.47-5.93 0-1.31.47-2.38 1.24-3.22-.12-.30-.54-1.52.12-3.18 0 0 1.01-.32 3.30 1.23a11.5 11.5 0 016.00 0c2.29-1.55 3.30-1.23 3.30-1.23.66 1.66.24 2.88.12 3.18.77.84 1.24 1.91 1.24 3.22 0 4.61-2.81 5.62-5.49 5.92.43.37.81 1.10.81 2.22v3.29c0 .32.22.70.83.58A12.51 12.51 0 0024 12.5C24 5.87 18.63.5 12 .5z"/></svg>
          <span>GitHub</span>
        </button>
        <button class="sbtn wx" type="button">
          <svg viewBox="0 0 24 24" fill="currentColor"><path d="M8.69 4C4.55 4 1.2 6.81 1.2 10.2c0 1.95 1.07 3.68 2.74 4.83-.12.71-.45 1.66-.97 2.4-.13.18.04.43.24.39 1.04-.19 1.94-.64 2.54-1.04.58.16 1.2.25 1.86.25.22 0 .44-.01.66-.03A5.2 5.2 0 018.7 15c0-2.93 2.95-5.3 6.59-5.3.22 0 .44.01.66.03C15.1 6.4 12.18 4 8.69 4zM6.1 8.2a1.05 1.05 0 110 2.1 1.05 1.05 0 010-2.1zm5.18 0a1.05 1.05 0 110 2.1 1.05 1.05 0 010-2.1z"/><path d="M21.8 14.05c0-2.7-2.68-4.9-5.98-4.9-3.3 0-5.98 2.2-5.98 4.9 0 2.71 2.68 4.9 5.98 4.9.67 0 1.32-.09 1.92-.27.5.31 1.23.72 2.27 1.04.2.05.38-.17.25-.36-.45-.63-.79-1.43-.89-2.02A4.9 4.9 0 0021.8 14.05zm-7.86-1.2a.9.9 0 110 1.8.9.9 0 010-1.8zm3.84 0a.9.9 0 110 1.8.9.9 0 010-1.8z"/></svg>
          <span>微信</span>
        </button>
      </div>

      <p class="signup">还没有公司？<a href="#">免费创建你的 AI 公司 →</a></p>
    </div>
  </main>
</div>
</body>
</html>
