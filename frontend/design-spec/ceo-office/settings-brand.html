<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=1536">
<title>品牌与显示 · Curis OS</title>
<style>
:root{
  --primary:#4a7c59; --primary-dark:#2f523b; --primary-light:#e8f0e8; --primary-soft:#f0f6f0;
  --accent:#705c30; --accent-light:#f5efe3;
  --bg:#faf6f0; --surface:#fffefb; --surface-2:#f7f2ea; --surface-3:#f0ebe0;
  --txt:#1f241c; --txt-2:#4a5346; --txt-3:#7a8273;
  --line:#e8e2d8; --line-2:#d9d2c6;
  --green:#15935a; --green-soft:#e8f5ed;
  --cyan:#3f7d6e; --amber:#a8742a; --amber-soft:#f9f0e0; --red:#b83230; --red-soft:#fae8e7;
  --radius:16px; --radius-sm:12px; --radius-xs:8px;
  --shadow:0 1px 2px rgba(74,85,66,.04),0 4px 12px rgba(74,85,66,.05);
  --shadow-lg:0 8px 28px rgba(74,85,66,.10);
  --font-serif:'Literata','Noto Serif SC','Songti SC',serif;
  --font-sans:'Nunito Sans','Inter','PingFang SC','Microsoft YaHei',sans-serif;
}
*{box-sizing:border-box}
html{margin:0}
body{margin:0;background:#e8e2d8;display:grid;place-items:center;min-height:100vh;overflow:auto;color:var(--txt);font-family:var(--font-sans);font-size:14px}
.app{width:1536px;height:1024px;background:var(--bg);display:flex;overflow:hidden;box-shadow:0 24px 60px rgba(31,36,28,.18)}
/* sidebar */
.sidebar{width:176px;flex:0 0 176px;background:var(--primary);color:#eef3ee;display:flex;flex-direction:column;padding:14px 10px;overflow:hidden}
.brand{display:flex;align-items:center;gap:8px;padding:4px 6px 14px;font-family:var(--font-serif);font-weight:700;font-size:15px;color:#fff}
.brand .logo{width:26px;height:26px;border-radius:8px;background:#fff;color:var(--primary);display:grid;place-items:center;font-size:15px}
.nav{overflow-y:auto;flex:1}
.nav-item{display:flex;align-items:center;gap:9px;padding:9px 8px;border-radius:var(--radius-xs);color:#dbe7dd;cursor:pointer;font-size:14px;font-weight:600;margin-bottom:2px;user-select:none}
.nav-item:hover{background:rgba(255,255,255,.10)}
.nav-item.active{background:#fff;color:var(--primary)}
.nav-item .ni-ic{width:20px;text-align:center;flex:0 0 20px}
.nav-item .ni-tx{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item .ni-ch{font-size:18px;opacity:.7}
.nav-sub{margin:1px 0 4px 28px}
.nav-sub .ns{display:block;padding:6px 8px;border-radius:var(--radius-xs);color:#cdddd2;font-size:13px;font-weight:500;cursor:pointer;text-decoration:none}
.nav-sub .ns:hover{background:rgba(255,255,255,.08);color:#fff}
.nav-sub .ns.active{color:#fff;font-weight:700}
.side-foot{margin-top:auto;padding-top:10px;border-top:1px solid rgba(255,255,255,.14);font-size:11px;color:#c6d8cd;display:flex;align-items:center;gap:8px}
.side-foot .av{width:24px;height:24px;border-radius:50%;background:#fff;color:var(--primary);display:grid;place-items:center;font-size:12px;font-weight:700}
/* main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{height:56px;flex:0 0 56px;display:flex;align-items:center;gap:12px;padding:0 20px;border-bottom:1px solid var(--line);background:var(--bg)}
.crumb{font-size:12px;color:var(--txt-3)}
.crumb b{color:var(--txt-2);font-weight:600}
.topbar .sp{flex:1}
.search{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line-2);border-radius:20px;padding:6px 12px;width:220px}
.search input{border:0;outline:0;background:transparent;font-family:var(--font-sans);font-size:13px;width:100%;color:var(--txt)}
.search .icon-svg{color:var(--txt-3)}
.avatar-sm{width:30px;height:30px;border-radius:50%;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;font-weight:700;font-size:12px}
.scroll{flex:1;overflow-y:auto;padding:14px 20px 18px}
/* page head */
.phead{display:flex;align-items:flex-start;gap:16px;margin-bottom:14px}
.phead .pt{font-family:var(--font-serif);font-size:24px;font-weight:700;line-height:1.1;margin:0}
.phead .psub{font-size:12px;color:var(--txt-3);margin-top:4px}
.pill{display:inline-flex;align-items:center;gap:5px;background:var(--accent-light);color:var(--accent);border-radius:20px;padding:4px 12px;font-size:12px;font-weight:600;margin-top:6px}
.phead .sp{flex:1}
.facts{display:flex;gap:10px;flex-wrap:wrap}
.fact{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;min-width:96px}
.fact .fv{font-size:20px;font-weight:700;font-family:var(--font-serif);color:var(--primary)}
.fact .fl{font-size:11px;color:var(--txt-3);margin-top:2px}
.btn-new{display:inline-flex;align-items:center;gap:6px;background:var(--primary);color:#fff;border:0;border-radius:var(--radius-xs);padding:9px 16px;font-size:12px;font-weight:700;cursor:pointer;font-family:var(--font-sans)}
.btn-new:hover{background:var(--primary-dark)}
.btn-ghost{display:inline-flex;align-items:center;gap:6px;background:var(--surface);color:var(--txt-2);border:1px solid var(--line-2);border-radius:var(--radius-xs);padding:9px 14px;font-size:12px;font-weight:600;cursor:pointer}
  /* form fields */
  .btn-new.ghost{background:var(--surface);color:var(--txt-2);border:1px solid var(--line-2)}
  .form-row{display:flex;gap:12px;margin-bottom:12px}
  .field{flex:1;min-width:0}
  .field label{display:block;font-size:12px;color:var(--txt-2);font-weight:600;margin-bottom:5px}
  .field input,.field select,.field textarea{width:100%;padding:9px 11px;border:1px solid var(--line-2);border-radius:var(--radius-xs);font-family:var(--font-sans);font-size:13px;background:var(--surface);color:var(--txt);outline:0;box-sizing:border-box}
  .field input:focus,.field select:focus,.field textarea:focus{border-color:var(--primary)}
  .field textarea{resize:vertical;min-height:60px;line-height:1.5}
  .switch{display:flex;align-items:center;justify-content:space-between;padding:9px 0;border-top:1px solid var(--line);font-size:13px;color:var(--txt-2)}
  .switch:first-of-type{border-top:0}
  .switch .lab{display:flex;flex-direction:column}
  .switch .lab small{font-size:11px;color:var(--txt-3);margin-top:1px}
  .track{width:38px;height:22px;border-radius:11px;background:var(--line-2);position:relative;cursor:pointer;transition:.15s;flex:0 0 38px}
  .track.on{background:var(--primary)}
  .track .knob{width:18px;height:18px;border-radius:50%;background:#fff;position:absolute;top:2px;left:2px;transition:.15s}
  .track.on .knob{left:18px}
  .logo-box{width:64px;height:64px;border-radius:14px;background:var(--primary-light);color:var(--primary);display:grid;place-items:center;font-family:var(--font-serif);font-weight:700;font-size:26px;margin-bottom:14px}
  .theme-dots{display:flex;gap:10px;margin:8px 0 14px}
  .color-dot{width:24px;height:24px;border-radius:50%;cursor:pointer;border:2px solid transparent;box-shadow:0 0 0 1px var(--line-2)}
  .color-dot.active{border-color:var(--txt)}
  .kv{display:flex;justify-content:space-between;padding:8px 0;border-top:1px solid var(--line);font-size:13px}
  .kv:first-child{border-top:0}
  .kv .k{color:var(--txt-3)} .kv .v{color:var(--txt-2);font-weight:600}
/* grid */
.grid12{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px}
.card-hd{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.card-hd .ct{font-family:var(--font-serif);font-size:15px;font-weight:600;color:var(--txt)}
.icon-box{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.icon-box.green{background:var(--green-soft);color:var(--green)}
.icon-box.cyan{background:#e6f1ee;color:var(--cyan)}
.icon-box.amber{background:var(--amber-soft);color:var(--amber)}
.icon-box.red{background:var(--red-soft);color:var(--red)}
.icon-box.primary{background:var(--primary-light);color:var(--primary)}
.icon-box.surface{background:var(--surface-2);color:var(--txt-2)}
.icon-box.violet{background:#efeaf8;color:#6b4fb0}
.icon-svg{width:1.1em;height:1.1em;fill:currentColor;vertical-align:middle}
.icon-svg.s20{width:20px;height:20px}
.icon-svg.s18{width:18px;height:18px}
.icon-svg.s16{width:16px;height:16px}
/* status */
.status-dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px}
.st-green{background:var(--green)} .st-amber{background:var(--amber)} .st-red{background:var(--red)} .st-cyan{background:var(--cyan)} .st-grey{background:var(--txt-3)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;border-radius:6px;padding:2px 8px}
.tag.green{background:var(--green-soft);color:var(--green)}
.tag.amber{background:var(--amber-soft);color:var(--amber)}
.tag.cyan{background:#e6f1ee;color:var(--cyan)}
.tag.violet{background:#efeaf8;color:#6b4fb0}
.tag.grey{background:var(--surface-3);color:var(--txt-3)}
/* empty */
.empty-box{border:1.5px dashed var(--line-2);border-radius:var(--radius-sm);padding:22px;text-align:center;color:var(--txt-3);font-size:13px;background:var(--surface-2)}
.empty-box .eb-ic{font-size:26px;color:var(--line-2);display:block;margin-bottom:6px}
/* module cards */
.mod-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}
.mod-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:16px;display:flex;flex-direction:column;cursor:pointer;transition:.15s;text-decoration:none;color:inherit}
.mod-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--primary-light)}
.mod-card .mc-ic{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;margin-bottom:10px}
.mod-card .mc-n{font-family:var(--font-serif);font-size:18px;font-weight:700}
.mod-card .mc-d{font-size:12px;color:var(--txt-3);margin:6px 0 10px;line-height:1.5;flex:1}
.mod-card .mc-foot{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--txt-2)}
.mini-row{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:12px;border-top:1px solid var(--line)}
.mini-row .mr-n{flex:1;color:var(--txt-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* list rows */
.row{display:flex;align-items:center;gap:12px;padding:11px 12px;border-radius:var(--radius-sm);background:var(--surface);border:1px solid var(--line);margin-bottom:8px}
.row .r-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;flex:0 0 34px}
.row .r-main{flex:1;min-width:0}
.row .r-t{font-weight:600;font-size:14px;color:var(--txt)}
.row .r-s{font-size:12px;color:var(--txt-3);margin-top:2px}
.row .r-meta{font-size:12px;color:var(--txt-2);text-align:right;white-space:nowrap}
/* boundary */
.boundary{display:flex;align-items:center;gap:8px;background:var(--accent-light);border:1px solid #e6dcc4;border-radius:var(--radius-xs);padding:8px 12px;font-size:11px;color:var(--accent);margin-top:14px}
.boundary .icon-svg{color:var(--accent)}
/* two col dept */
.dept2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .span4{grid-column:span 4}.span5{grid-column:span 5}.span6{grid-column:span 6}.span7{grid-column:span 7}.span8{grid-column:span 8}.span9{grid-column:span 9}.span12{grid-column:span 12}
  /* list pages: back link + category bar */
  .back-link{display:inline-flex;align-items:center;gap:5px;color:var(--primary);font-size:12px;font-weight:700;text-decoration:none;margin-bottom:10px}
  .back-link:hover{opacity:.8}
  .cat-bar{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:10px 14px;overflow-x:auto;margin-bottom:14px}
  .cat-chip{display:inline-flex;align-items:center;gap:5px;padding:6px 13px;border-radius:20px;background:var(--surface-2);border:1px solid var(--line);color:var(--txt-2);font-size:12px;font-weight:600;cursor:pointer;white-space:nowrap;text-decoration:none}
  .cat-chip:hover{background:var(--primary-light);color:var(--primary)}
  .cat-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
  .cat-spacer{margin-left:auto;font-size:11px;color:var(--txt-3);display:flex;align-items:center;gap:5px;white-space:nowrap}
  /* capability card grid */
  .cap-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}
  .cap-card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:15px;display:flex;flex-direction:column;transition:.15s}
  .cap-card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:var(--primary-light)}
  .cap-card .cc-top{display:flex;align-items:flex-start;gap:10px}
  .cap-card .cc-ic{width:42px;height:42px;border-radius:11px;display:grid;place-items:center;flex:0 0 42px}
  .cap-card .cc-ic.skill{background:#efeaf8;color:#6b4fb0}
  .cap-card .cc-ic.tool{background:var(--amber-soft);color:var(--amber)}
  .cap-card .cc-ic.model{background:var(--primary-light);color:var(--primary)}
  .cap-card .cc-ic.agent{background:#e6f1ee;color:var(--cyan)}
  .cap-card .cc-ic.workflow{background:var(--green-soft);color:var(--green)}
  .cap-card .cc-name{font-family:var(--font-serif);font-size:15px;font-weight:700;color:var(--txt);line-height:1.2}
  .cap-card .cc-dev{font-size:11px;color:var(--txt-3);margin-top:4px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .cap-card .badge{font-size:9px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:4px;background:var(--surface-3);color:var(--txt-3)}
  .cap-card .cc-tag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:4px;background:var(--primary-soft);color:var(--primary-dark)}
  .cap-card .cc-tag.am{background:var(--amber-soft);color:var(--amber)}
  .cap-card .cc-tag.cy{background:#e6f1ee;color:var(--cyan)}
  .cap-card .cc-desc{font-size:11.5px;color:var(--txt-2);line-height:1.55;margin:10px 0}
  .cap-card .cc-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;padding:8px 0;border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);font-size:10.5px;color:var(--txt-3)}
  .cap-card .cc-stats b{color:var(--txt-2);font-size:11.5px}
  .cap-card .cc-foot{display:flex;align-items:center;justify-content:space-between;margin-top:10px}
  .st-badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:5px}
  .st-available{background:var(--green-soft);color:var(--green)}
  .st-blocked{background:var(--amber-soft);color:var(--amber)}
  .st-official{background:var(--primary-light);color:var(--primary)}
  .st-custom{background:#efeaf8;color:#6b4fb0}
  .cap-card .acts{display:flex;gap:8px}
  .cap-card .acts a{font-size:11px;color:var(--txt-3);text-decoration:none;font-weight:600}
  .cap-card .acts a:hover{color:var(--primary)}
  .cap-card .acts a.primary{color:var(--primary)}
</style></head>
