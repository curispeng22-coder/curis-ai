<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=1440, initial-scale=1" />
<title>CURIS · 桌面 Shell 原型 · 1440 × 900</title>
<style>
/* ============================================================
   CURIS Desktop Shell Frame · 1440 × 900
   单一文件、零依赖。只画 App Shell 框架，不含任何业务页面。

   颜色来源（不发明新配色）：
   · 主画布 / 表面 / 线 / 文字 = CURIS_VISUAL_STANDARD_V1（Light）
     Canvas #F7F8FA · Base #FFFFFF · Surface 1 #F1F3F5 · Surface 2 #E9EDF1
     Border #DDE2E7 · Text #1D232A · Text 2 #4D5661 · Muted #7C8794 · Disabled #AAB2BC
   · 全局导航 = 已接受业务探索的深灰蓝导航（Writing --rail / Music --nav #3A4A52）
   · 交互强调色 = 已接受业务探索强调色 #8FB850（Frozen Visual Standard 记录的
     #806BE5 不用于导航；本帧不改动任何冻结文档）
   macOS 三个窗口圆点为操作系统窗口控件，不属于产品配色。

   尺寸来源（Frozen Shell Contract §1.1 / §1.5 + UI Blueprint §11）：
   Navigation 220px（可完全收起）· Context 按需 256px · Main 最小 560px 且优先占宽
   · Utility 按需 320–440px · Pane Header 52px · 动效 320ms
   T1 控制 Nav；T2 固定于 Main Header 左侧；T3 折叠态在 Main Header 右侧、
   展开后转移到 Utility Header 右侧。三者为独立双向开关，不设独立 ✕。
   ============================================================ */
:root{
  --ui-bg:#f7f8fa; --ui-surface:#ffffff; --ui-surface-1:#f1f3f5; --ui-surface-2:#e9edf1;
  --ui-line:#dde2e7; --ui-text:#1d232a; --ui-text-2:#4d5661; --ui-text-3:#7c8794; --ui-disabled:#aab2bc;

  --nav:#3a4a52; --nav-2:#43535b; --nav-line:rgba(255,255,255,.12);
  --nav-text:#dce2e0; --nav-text-2:#aab7ba; --nav-hover:rgba(255,255,255,.06); --nav-active:rgba(255,255,255,.10);
  --accent:#8fb850;

  --nav-w:220px; --ctx-w:256px; --util-w:360px;
  --ctx-min:208px; --ctx-max:360px; --util-min:320px; --util-max:440px;
  --main-min:560px; --header-h:52px; --dur:320ms; --ease:cubic-bezier(.4,0,.2,1);
  --radius:8px; --radius-sm:6px;
  --shadow-1:0 1px 2px rgba(29,35,42,.06);
  --shadow-2:0 8px 24px rgba(29,35,42,.12);
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ui-surface-1); color:var(--ui-text);
  font:400 13px/1.5 system-ui,-apple-system,"PingFang SC","Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
[hidden]{display:none !important}
.icon{display:block;width:16px;height:16px;flex:0 0 auto}

/* ---------- 原型台面：外面只放运行读数，不是产品界面 ---------- */
.stage-wrap{padding:20px 0 28px;display:flex;flex-direction:column;align-items:center;gap:8px}
.stage-note{width:1440px;display:flex;align-items:center;gap:12px;color:var(--ui-text-3);font-size:11px;letter-spacing:.02em}
.stage-note b{color:var(--ui-text-2);font-weight:500}
.stage-note .readout{margin-left:auto;font-variant-numeric:tabular-nums}

.stage{position:relative;width:1440px;height:900px;flex:0 0 auto;
  border-radius:var(--radius);overflow:hidden;background:var(--ui-surface);
  box-shadow:inset 0 0 0 1px var(--ui-line),0 1px 2px rgba(29,35,42,.06)}

/* ---------- 四栏骨架：Nav 固定 · Context 按需 · Main 优先占宽 · Utility 按需 ---------- */
.shell{display:flex;width:100%;height:100%;background:var(--ui-bg)}
.pane{display:flex;flex-direction:column;min-height:0;transition:width var(--dur) var(--ease)}
.pane[hidden]{display:none}
.pane-head{height:var(--header-h);flex:0 0 var(--header-h);display:flex;align-items:center;gap:8px;
  padding:0 12px;border-bottom:1px solid var(--ui-line);background:var(--ui-surface)}

/* ---------- 第一栏 · Navigation ---------- */
.pane-nav{width:var(--nav-w);flex:0 0 var(--nav-w);background:var(--nav);color:var(--nav-text);border-bottom:0}
.pane-nav .pane-head{background:transparent;border-bottom:1px solid var(--nav-line);padding:0 10px 0 14px;justify-content:space-between}
.traffic{display:flex;align-items:center;gap:8px}
.traffic i{width:11px;height:11px;border-radius:50%;display:block}
.dot-close{background:#ff5f57}.dot-min{background:#febc2e}.dot-zoom{background:#28c840}
.nav-head-actions{display:flex;align-items:center;gap:2px}
.iconbtn{width:30px;height:30px;border-radius:var(--radius-sm);display:grid;place-items:center;color:var(--nav-text-2)}
.iconbtn:hover{background:var(--nav-hover);color:#fff}
.iconbtn[aria-pressed="true"]{background:var(--nav-active);color:#fff}
.nav-scroll{flex:1 1 auto;min-height:0;overflow:auto;padding:8px 8px 8px}
.brand{display:flex;align-items:center;gap:8px;height:40px;padding:0 12px;color:#fff}
.brand .word{font-size:13px;font-weight:600;letter-spacing:.10em}
.nav-group-label{color:var(--nav-text-2);font-size:11px;letter-spacing:.06em;padding:14px 8px 6px}
.nav-item{position:relative;display:flex;align-items:center;gap:10px;width:100%;height:34px;padding:0 10px 0 12px;
  border-radius:var(--radius-sm);color:var(--nav-text);text-align:left}
.nav-item+.nav-item{margin-top:1px}
.nav-item:hover{background:var(--nav-hover)}
.nav-item.is-current{background:var(--nav-active);color:#fff}
.nav-item.is-current::before{content:"";position:absolute;left:0;top:6px;bottom:6px;width:3px;border-radius:0 2px 2px 0;background:var(--accent)}
.nav-item .icon{color:var(--nav-text-2)}
.nav-item.is-current .icon,.nav-item:hover .icon{color:#fff}
.nav-item .label{flex:1 1 auto;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-empty{color:var(--nav-text-2);font-size:12px;padding:2px 10px 6px}
.nav-foot{flex:0 0 auto;border-top:1px solid var(--nav-line);padding:8px}
.user-row{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 8px;border-radius:var(--radius-sm);text-align:left}
.user-row:hover{background:var(--nav-hover)}
.avatar{width:26px;height:26px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:rgba(255,255,255,.14);color:#fff;font-size:12px;font-weight:500}
.user-meta{flex:1 1 auto;min-width:0}
.user-meta .n{color:#fff;font-size:12.5px;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.user-meta .r{color:var(--nav-text-2);font-size:11px;line-height:1.3}
.user-row .icon{color:var(--nav-text-2)}

/* ---------- 第二栏 · Context ---------- */
.pane-ctx{width:var(--ctx-w);flex:0 0 var(--ctx-w);background:var(--ui-surface);border-right:1px solid var(--ui-line)}
.pane-title{font-size:12.5px;font-weight:500;color:var(--ui-text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pane-sub{font-size:11px;color:var(--ui-text-3)}
.pane-head .spacer{flex:1 1 auto}
.pane-body{flex:1 1 auto;min-height:0;overflow:auto;padding:16px}
.pane-body.plain{background:var(--ui-surface)}

/* ---------- 第三栏 · Main（始终存在、优先占宽） ---------- */
.pane-main{flex:1 1 auto;min-width:var(--main-min);background:var(--ui-bg)}
.pane-main .pane-head{background:var(--ui-surface);padding:0 12px 0 10px}
.crumb{display:flex;align-items:center;gap:8px;min-width:0}
.crumb .now{font-size:12.5px;font-weight:500;color:var(--ui-text)}
.crumb .dim{font-size:12px;color:var(--ui-text-3)}
.main-body{flex:1 1 auto;min-height:0;overflow:auto;padding:24px}
.placeholder{max-width:520px;margin:64px auto 0;text-align:center;color:var(--ui-text-3)}
.placeholder .icon{width:22px;height:22px;margin:0 auto 12px;color:var(--ui-disabled)}
.placeholder .t{font-size:14px;color:var(--ui-text-2);margin-bottom:4px}
.placeholder .d{font-size:12px}

/* ---------- 第四栏 · Utility ---------- */
.pane-util{width:var(--util-w);flex:0 0 var(--util-w);background:var(--ui-surface);border-left:1px solid var(--ui-line)}

/* ---------- 拖拽调宽（Context 右缘 / Utility 左缘） ---------- */
.resize{position:absolute;top:0;bottom:0;width:9px;cursor:col-resize;z-index:3}
.resize::after{content:"";position:absolute;top:0;bottom:0;width:1px;background:transparent;transition:background 140ms}
.pane{position:relative}
.pane-ctx .resize{right:-4px}
.pane-util .resize{left:-4px}
.resize:hover::after,.resize.is-active::after{background:var(--accent)}
body.is-resizing{cursor:col-resize;user-select:none}

/* ---------- CEO Assistant：轻量悬浮覆盖入口，不占栏、不是第五栏 ---------- */
.assistant-dock{position:absolute;right:16px;bottom:16px;z-index:40;display:flex;align-items:center;gap:9px;
  height:42px;padding:0 14px 0 10px;border-radius:999px;background:var(--ui-surface);
  border:1px solid var(--ui-line);box-shadow:var(--shadow-2);text-align:left}
.assistant-dock:hover{border-color:var(--ui-disabled)}
.assistant-dock .ava{width:24px;height:24px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  background:var(--ui-surface-2);color:var(--ui-text-2)}
.assistant-dock .t{font-size:12.5px;color:var(--ui-text);line-height:1.25}
.assistant-dock .d{font-size:11px;color:var(--ui-text-3);line-height:1.25}

/* ---------- 窄窗口（沿用冻结自适应：先收 Utility，再收 Context） ---------- */
@media (max-width:1479px){
  .stage-wrap{padding:12px 0 20px}
  .stage-note{width:100%;max-width:1440px;padding:0 12px}
}
.sr-only{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
</style>
</head>
<body>
<div class="stage-wrap">

  <!-- 原型台面读数：不是产品界面的一部分 -->
  <div class="stage-note">
    <b>桌面 Shell 原型 · 1440 × 900</b>
    <span>T1 导航 · T2 Context · T3 Utility，各自独立开合</span>
    <span class="readout" id="readout">Nav 220 · Context — · Main 1220 · Utility —</span>
  </div>

  <div class="stage" id="stage">
    <div class="shell" id="shell">

      <!-- ============ 第一栏 · Navigation（固定全局导航） ============ -->
      <aside class="pane pane-nav" id="paneNav" aria-label="全局导航">
        <div class="pane-head">
          <div class="traffic" aria-hidden="true"><i class="dot-close"></i><i class="dot-min"></i><i class="dot-zoom"></i></div>
          <div class="nav-head-actions">
            <button class="iconbtn" type="button" title="搜索对象" aria-label="搜索对象">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14Z M20 20l-3.5-3.5"/></svg>
            </button>
            <button class="iconbtn" type="button" id="t1" aria-pressed="true" aria-controls="paneNav" title="收起导航 (T1)">
              <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16 M4 12h11 M4 17h16"/></svg>
            </button>
          </div>
        </div>

        <nav class="nav-scroll" aria-label="七个一级区域">
          <div class="brand" aria-label="CURIS"><span class="word">CURIS</span></div>
          <button class="nav-item is-current" type="button" data-area="ceo">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18Z M15.5 8.5l-2.1 5-5 2.1 2.1-5 5-2.1Z"/></svg>
            <span class="label">CEO 工作台</span>
          </button>
          <button class="nav-item" type="button" data-area="business">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h7v7H4z M13 5h7v7h-7z M4 14h7v5H4z M13 14h7v5h-7z"/></svg>
            <span class="label">业务空间</span>
          </button>
          <button class="nav-item" type="button" data-area="org">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v4 M5 21v-6h14v6 M5 15v-4h14v4"/></svg>
            <span class="label">组织中心</span>
          </button>
          <button class="nav-item" type="button" data-area="talent">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-1.5a3.5 3.5 0 0 0-3.5-3.5h-5A3.5 3.5 0 0 0 4 18.5V20 M10 11a3.4 3.4 0 1 0 0-6.8 3.4 3.4 0 0 0 0 6.8 M20 20v-1.5a3.5 3.5 0 0 0-2.6-3.4 M15.4 4.4a3.4 3.4 0 0 1 0 6.5"/></svg>
            <span class="label">人才与能力</span>
          </button>
          <button class="nav-item" type="button" data-area="insight">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20h16 M7 20v-6 M12 20V6 M17 20v-9"/></svg>
            <span class="label">经营洞察</span>
          </button>
          <button class="nav-item" type="button" data-area="library">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 5.5A2.5 2.5 0 0 1 7.5 3H19v15H7.5A2.5 2.5 0 0 0 5 20.5V5.5Z M5 20.5A2.5 2.5 0 0 1 7.5 18H19v3H7.5A2.5 2.5 0 0 1 5 20.5Z"/></svg>
            <span class="label">资料库</span>
          </button>
          <button class="nav-item" type="button" data-area="meeting">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v14H4z M4 10h16 M8 3v4 M16 3v4"/></svg>
            <span class="label">会议</span>
          </button>

          <div class="nav-group-label">最近对话</div>          <div class="nav-empty">还没有最近对话</div>
        </nav>

        <div class="nav-foot">
          <button class="user-row" type="button" title="用户中心">
            <span class="avatar" aria-hidden="true">C</span>
            <span class="user-meta">
              <span class="n">CEO（你）</span>
              <span class="r">公司负责人</span>
            </span>
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" title="设置"><path d="M4 8h9 M17 8h3 M4 16h3 M11 16h9"/><circle cx="14.5" cy="8" r="1.8"/><circle cx="8.5" cy="16" r="1.8"/></svg>
          </button>
        </div>
      </aside>

      <!-- ============ 第二栏 · Context（可折叠） ============ -->
      <section class="pane pane-ctx" id="paneCtx" hidden aria-label="对象上下文">
        <div class="pane-head">
          <span class="pane-title">对象上下文</span>
          <span class="spacer"></span>
        </div>
        <div class="pane-body plain">
          <div class="pane-sub">当前没有选中对象</div>
          <p class="pane-sub" style="margin:6px 0 0;color:var(--ui-text-3)">选中对象后，这里显示它的身份、规则与可进入的下级。</p>
        </div>
        <span class="resize" data-resize="ctx" role="separator" aria-orientation="vertical" aria-label="调整 Context 宽度"></span>
      </section>

      <!-- ============ 第三栏 · Main（始终存在、优先占宽） ============ -->
      <main class="pane pane-main" id="paneMain" aria-label="主工作区">
        <div class="pane-head">
          <!-- T1：导航收起后转移到 Main Header 最左 -->
          <button class="iconbtn" type="button" id="t1b" aria-pressed="false" aria-controls="paneNav" hidden title="展开导航 (T1)"
                  style="color:var(--ui-text)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16 M4 12h11 M4 17h16"/></svg>
          </button>
          <!-- T2：固定在 Main Header 左侧 -->
          <button class="iconbtn" type="button" id="t2" aria-pressed="false" aria-controls="paneCtx" title="对象上下文 (T2)" style="color:var(--ui-text-2)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M9 5v14"/></svg>
          </button>
          <div class="crumb">
            <span class="now">CEO 工作台</span>
            <span class="dim">· 主工作区</span>
          </div>
          <span class="spacer"></span>
          <button class="iconbtn" type="button" title="通知与待处理" aria-label="通知与待处理" style="color:var(--ui-text-2)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M18 15V11a6 6 0 1 0-12 0v4l-1.5 3h15L18 15Z M10 21h4"/></svg>
          </button>
          <!-- T3：折叠态在 Main Header 右侧；展开后转移到 Utility Header -->
          <button class="iconbtn" type="button" id="t3" aria-pressed="false" aria-controls="paneUtil" title="辅助查看 (T3)" style="color:var(--ui-text-2)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M15 5v14"/></svg>
          </button>
          <button class="iconbtn" type="button" title="更多" aria-label="更多" style="color:var(--ui-text-2)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 12h.01 M12 12h.01 M18 12h.01"/></svg>
          </button>
        </div>
        <div class="main-body">
          <div class="placeholder">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h16v13H4z M4 10h16"/></svg>
            <div class="t">还没有打开任何对象</div>
            <div class="d">从左侧导航进入一个区域开始工作。</div>
          </div>
        </div>
      </main>

      <!-- ============ 第四栏 · Utility（可独立折叠） ============ -->
      <aside class="pane pane-util" id="paneUtil" hidden aria-label="辅助查看">
        <span class="resize" data-resize="util" role="separator" aria-orientation="vertical" aria-label="调整 Utility 宽度"></span>
        <div class="pane-head">
          <span class="pane-title">辅助查看</span>
          <span class="spacer"></span>
          <button class="iconbtn" type="button" title="最大化" aria-label="最大化" style="color:var(--ui-text-2)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M5 15v4h4 M19 9V5h-4 M5 9V5h4 M19 15v4h-4"/></svg>
          </button>
          <!-- T3：展开后从 Main Header 转移至此 -->
          <button class="iconbtn" type="button" id="t3b" aria-pressed="true" aria-controls="paneUtil" title="收起辅助查看 (T3)" style="color:var(--ui-text-2)">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 5h16v14H4z M15 5v14"/></svg>
          </button>
        </div>
        <div class="pane-body plain">
          <div class="pane-sub">当前没有可参考的内容</div>
          <p class="pane-sub" style="margin:6px 0 0;color:var(--ui-text-3)">结果、证据与工具在需要时出现在这里。</p>
        </div>
      </aside>
    </div>

    <!-- 全局能力：轻量悬浮覆盖入口，不占四栏、不是第五栏 -->
    <button class="assistant-dock" type="button" id="assistant" title="CEO Assistant">
      <span class="ava" aria-hidden="true">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v2 M6 7h12v10H6z M9 12h.01 M15 12h.01 M10 20h4"/></svg>
      </span>
      <span>
        <span class="t">CEO Assistant</span>
        <span class="d" style="display:block">需要我处理什么？</span>
      </span>
    </button>
  </div>
</div>

<script>
(function(){
  "use strict";
  var shell   = document.getElementById('shell');
  var paneNav = document.getElementById('paneNav');
  var paneCtx = document.getElementById('paneCtx');
  var paneUtil= document.getElementById('paneUtil');
  var paneMain= document.getElementById('paneMain');
  var t1 = document.getElementById('t1'), t1b = document.getElementById('t1b');
  var t2 = document.getElementById('t2'), t3 = document.getElementById('t3'), t3b = document.getElementById('t3b');
  var readout = document.getElementById('readout');

  var LIMIT = { ctx:[208,360], util:[320,440], main:560, nav:220 };

  var state = { nav:true, ctx:false, util:false };

  // 允许用 ?state=ctx,util 直接进入某个布局（便于检查与截图），默认 Nav + Main。
  (function initFromQuery(){
    var m = /[?&]state=([^&]*)/.exec(location.search);
    if(!m) return;
    var list = decodeURIComponent(m[1]).split(',').map(function(s){return s.trim();}).filter(Boolean);
    if(list.indexOf('nonav') >= 0) state.nav = false;
    if(list.indexOf('nav')    >= 0) state.nav = true;
    state.ctx  = list.indexOf('ctx')  >= 0;
    state.util = list.indexOf('util') >= 0;
  })();

  function widthOf(el){ return el.getBoundingClientRect().width; }

  function apply(){
    if(state.nav){
      paneNav.hidden = false;
      paneNav.style.width = LIMIT.nav + 'px';
      paneNav.style.flexBasis = LIMIT.nav + 'px';
    } else {
      paneNav.hidden = true;
    }

    paneCtx.hidden  = !state.ctx;
    paneUtil.hidden = !state.util;

    // T1：导航收起后转移到 Main Header 最左
    t1b.hidden = state.nav;
    t1.setAttribute('aria-pressed', String(state.nav));
    // T2：始终在 Main Header 左侧，双向控制 Context
    t2.setAttribute('aria-pressed', String(state.ctx));
    t2.title = state.ctx ? '收起对象上下文 (T2)' : '展开对象上下文 (T2)';
    // T3：折叠态在 Main Header 右侧，展开后转移到 Utility Header 右侧
    t3.hidden  = state.util;
    t3b.hidden = !state.util;
    t3.setAttribute('aria-pressed', String(state.util));
    t3b.setAttribute('aria-pressed', String(state.util));

    requestAnimationFrame(read);
  }

  function read(){
    var navW  = state.nav  ? Math.round(widthOf(paneNav))  : 0;
    var ctxW  = state.ctx  ? Math.round(widthOf(paneCtx))  : 0;
    var utilW = state.util ? Math.round(widthOf(paneUtil)) : 0;
    var mainW = Math.round(widthOf(paneMain));
    readout.textContent = 'Nav ' + navW + ' · Context ' + (state.ctx ? ctxW : '—') +
      ' · Main ' + mainW + ' · Utility ' + (state.util ? utilW : '—');
    window.__shellFrame = {
      state:{ nav:state.nav, ctx:state.ctx, util:state.util },
      widths:{ nav:navW, ctx:ctxW, main:mainW, util:utilW },
      stage:{ w:Math.round(widthOf(document.getElementById('stage'))), h:Math.round(document.getElementById('stage').getBoundingClientRect().height) }
    };
  }

  function toggle(which){
    state[which] = !state[which];
    apply();
  }

  t1.addEventListener('click',  function(){ state.nav  = !state.nav;  apply(); });
  t1b.addEventListener('click', function(){ state.nav  = !state.nav;  apply(); });
  t2.addEventListener('click',  function(){ toggle('ctx'); });
  t3.addEventListener('click',  function(){ toggle('util'); });
  t3b.addEventListener('click', function(){ toggle('util'); });
  document.getElementById('assistant').addEventListener('click', function(){ /* 悬浮入口：原型内不展开对话 */ });

  /* ---------- 拖拽调宽：Context 右缘 / Utility 左缘；Main 始终不小于 560px ---------- */
  function clamp(v, lo, hi){ return Math.max(lo, Math.min(hi, v)); }

  function startResize(handle, ev){
    ev.preventDefault();
    var kind = handle.dataset.resize;                 // 'ctx' | 'util'
    var pane = kind === 'ctx' ? paneCtx : paneUtil;
    var startX = ev.clientX;
    var startW = widthOf(pane);
    handle.classList.add('is-active');
    document.body.classList.add('is-resizing');

    function move(e){
      var delta = e.clientX - startX;
      var next  = kind === 'ctx' ? startW + delta : startW - delta;
      var lo = kind === 'ctx' ? LIMIT.ctx[0] : LIMIT.util[0];
      var hi = kind === 'ctx' ? LIMIT.ctx[1] : LIMIT.util[1];
      // 保证 Main 不小于 560px
      var fixed = (state.nav ? LIMIT.nav : 0) + (state.ctx ? (kind === 'ctx' ? next : widthOf(paneCtx)) : 0) +
                  (state.util ? (kind === 'util' ? next : widthOf(paneUtil)) : 0);
      var room = 1440 - fixed;
      if(room < LIMIT.main){ hi = Math.min(hi, next - (LIMIT.main - room)); }
      next = clamp(next, lo, Math.max(lo, hi));
      pane.style.width = next + 'px';
      pane.style.flexBasis = next + 'px';
      read();
    }
    function end(){
      handle.classList.remove('is-active');
      document.body.classList.remove('is-resizing');
      window.removeEventListener('pointermove', move);
      window.removeEventListener('pointerup', end);
      read();
    }
    window.addEventListener('pointermove', move);
    window.addEventListener('pointerup', end);
  }

  Array.prototype.forEach.call(document.querySelectorAll('.resize'), function(h){
    h.addEventListener('pointerdown', function(e){ startResize(h, e); });
  });

  /* ---------- 一级导航当前态（原型内只切换 selected，不进入业务页面） ---------- */
  Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(item){
    item.addEventListener('click', function(){
      Array.prototype.forEach.call(document.querySelectorAll('.nav-item'), function(other){ other.classList.remove('is-current'); });
      item.classList.add('is-current');
      var crumbNow = document.querySelector('.crumb .now');
      if(crumbNow) crumbNow.textContent = item.querySelector('.label').textContent;
      read();
    });
  });

  apply();
  window.addEventListener('resize', read);
})();
</script>
</body>
</html>
