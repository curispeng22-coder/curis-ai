  <style id="curis-frozen-patch">
  /* Frozen alignment patch (Palette-B) — single source = _system/tokens.css (--ui-*) */
  /* root vars merged into head single source (--ui-*) */
  .theme-switch { display: inline-flex; gap: var(--ui-sp-1); align-items: center; }
  .theme-btn {
    border: 1px solid var(--ui-line); background: var(--ui-surface-2);

  .topbar { border-bottom-color: var(--ui-line); }
  </style>
  <script>
  (function () {
    if (document.querySelector('[data-curis-theme]')) return;
    var sw = document.createElement('div');
    sw.className = 'theme-switch';
    sw.setAttribute('role', 'group');
    sw.setAttribute('aria-label', '主题切换');
    var labels = { dark: '深色', light: '浅色', system: '自动' };
    ['dark', 'light', 'system'].forEach(function (t) {
      var b = document.createElement('button');
      b.className = 'theme-btn';
      b.setAttribute('data-curis-theme', t);
      b.textContent = labels[t];
      sw.appendChild(b);
    });
    var host = document.querySelector('.topbar') || document.querySelector('.sidebar');
    if (host) host.appendChild(sw);
  })();
  </script>
