    function simLabel(k) {

    function render() {
      var inbox = document.getElementById('inbox');
      var empty = document.getElementById('emptyState');
      var badge = document.getElementById('pendingBadge');
      if (!DECISIONS.length) {
        inbox.hidden = true; empty.hidden = false;
        if (badge) badge.textContent = '待 CEO 决策：0';
        return;
      }
      inbox.hidden = false; empty.hidden = true;
      inbox.innerHTML = DECISIONS.map(renderDecision).join('');
      if (badge) badge.textContent = '待 CEO 决策：' + DECISIONS.length;
      bindInbox();
    }

    /* ── 交互 ── */
    function goBack() {
      try {
        var ref = document.referrer;
        if (ref && new URL(ref).origin === location.origin) { history.back(); return; }
      } catch (e) {}
      location.href = 'ceo-desk.html';
    }

    function bindInbox() {
      var inbox = document.getElementById('inbox');

      inbox.addEventListener('click', function (e) {
        var head = e.target.closest('.dr-item-head');
        if (head) { toggleItem(head); return; }

        var opt = e.target.closest('.dr-option');
        if (opt) { selectOption(opt); return; }

        var tab = e.target.closest('.dr-sim-tab');
        if (tab) { showSim(tab); return; }

        var decide = e.target.closest('[data-decide]');
        if (decide) { makeDecision(decide); return; }

        var back = e.target.closest('.dr-back');
        if (back) { goBack(); return; }
      });

      inbox.addEventListener('keydown', function (e) {
        var head = e.target.closest('.dr-item-head');
        if (head && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); toggleItem(head); return; }
        var opt = e.target.closest('.dr-option');
        if (opt && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); selectOption(opt); }
      });
    }

    function toggleItem(head) {
      var item = head.closest('.dr-item');
      var detail = item.querySelector('.dr-detail');
      var expanded = head.getAttribute('aria-expanded') === 'true';
      head.setAttribute('aria-expanded', String(!expanded));
      detail.hidden = expanded;
    }

    function selectOption(opt) {
      var item = opt.closest('.dr-item');
      var key = opt.dataset.option;
      item.querySelectorAll('.dr-option').forEach(function (o) {
        var sel = o.dataset.option === key;
        o.classList.toggle('selected', sel);
        o.setAttribute('aria-checked', String(sel));
      });
    }

    function showSim(tab) {
      var item = tab.closest('.dr-item');
      var key = tab.dataset.sim;
      item.querySelectorAll('.dr-sim-panel').forEach(function (p) { p.classList.remove('active'); });
      item.querySelector('#sim-' + item.dataset.id + '-' + key).classList.add('active');
      item.querySelectorAll('.dr-sim-tab').forEach(function (t) {
        var active = t.dataset.sim === key;
        t.classList.toggle('active', active);
        t.setAttribute('aria-selected', String(active));
      });
    }

    function makeDecision(btn) {
      var item = btn.closest('.dr-item');
      var d = DECISIONS.filter(function (x) { return x.id === item.dataset.id; })[0];
      if (!d) return;
      var choice = btn.dataset.decide;
      var data = d.outcomes[choice];
      if (!data) return;

      // 选中对应选项
      item.querySelectorAll('.dr-option').forEach(function (o) {
        var sel = o.dataset.option === choice;
        o.classList.toggle('selected', sel);
        o.setAttribute('aria-checked', String(sel));
      });

      var now = new Date();
      var ts = now.toISOString().replace('T', ' ').slice(0, 19);
      var id = 'decision://' + now.toISOString().slice(0, 10) + '/' + choice + '-' + now.getTime();

      item.querySelector('.dr-after-title-text').textContent = data.title;
      item.querySelector('.dr-after-body').innerHTML = data.body;
      item.querySelector('#evid-' + d.id).textContent = id;
      item.querySelector('#trace-' + d.id).innerHTML =
        '<div><span class="k">决策动作：</span>' + esc(data.action) + '</div>' +
        '<div><span class="k">执行路径：</span>' + esc(data.next) + '</div>' +
        '<div><span class="k">记录时间：</span><span class="mono">' + esc(ts) + '</span></div>' +
        '<div><span class="k">来源页面：</span>决策室 / decision-room.html</div>' +
        '<div><span class="k">写入层：</span>依据 / 事实层 · 状态：不可篡改</div>';

      var after = item.querySelector('#after-' + d.id);
      after.classList.add('active');
      after.scrollIntoView({ behavior: 'smooth', block: 'nearest' });

      // 锁定操作按钮，更新状态徽标
      item.querySelectorAll('#actions-' + d.id + ' .btn').forEach(function (b) { b.disabled = true; });
      var pill = item.querySelector('.dr-pill');
      if (pill) {
        var map = { approve: 'decided', defer: 'deferred', revise: 'revised', reject: 'rejected' };
        pill.className = 'dr-pill ' + (map[choice] || 'decided');
        pill.textContent = { approve: '已决策', defer: '已延后', revise: '已退回', reject: '已拒绝' }[choice] || '已决策';
      }
    }

    /* ── 返回按钮（顶栏）+ 主题切换注入 ── */
    document.getElementById('backBtn').addEventListener('click', goBack);

    if (document.querySelector('[data-curis-theme]')) {
      // 已是 curis-prototype.js 注入的，跳过
    } else {
      var sw = document.querySelector('.theme-switch');
      if (sw && !sw.children.length) {
        var labels = { dark: '深色', light: '浅色', system: '自动' };
        ['dark', 'light', 'system'].forEach(function (t) {
          var b = document.createElement('button');
          b.className = 'theme-btn';
          b.setAttribute('data-curis-theme', t);
          b.textContent = labels[t];
          sw.appendChild(b);
        });
      }
    }

    render();
  })();
  </script>
</body>
</html>
